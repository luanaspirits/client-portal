<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>The Connection Map</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('cm-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
:root{color-scheme:light;
  --bg:#f8f4fb;--bg2:#efe6f6;--card:#fff;--rule:#e6daf0;
  --ink:#2b1f38;--soft:#5f5070;--dim:#9a8bab;
  --plum:#5b3a7c;--plum2:#7c58a3;--lav:#c9b4e2;--lav2:#f2eaf9;
  --gold:#a8823e;--glow:#efd59d;--rose:#c4899b;
  --side:#46305f;--side2:#33224a;--star:#f7f0fc;--mist:#d2c4e2;
  --serif:'Playfair Display',Georgia,serif;--sans:'Jost','Helvetica Neue',Arial,sans-serif;--mono:'DM Mono',ui-monospace,Menlo,monospace;
  --sh:0 18px 40px -22px rgba(70,48,95,.35)}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font:400 17px/1.7 var(--sans);color:var(--ink);background:var(--bg);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
textarea,input{-webkit-user-select:text;user-select:text}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--plum2);outline-offset:3px}
p{margin:0} h2,h3{margin:0;font-family:var(--serif);font-weight:400}
em{font-family:var(--serif);font-style:italic} strong{font-weight:500}
a{color:var(--plum)} svg{display:block}

/* shell */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
@media(min-width:1000px){.app{grid-template-columns:300px minmax(0,1fr)}}
.side{position:fixed;inset:0 auto 0 0;z-index:30;width:min(320px,86vw);overflow-y:auto;overscroll-behavior:contain;color:var(--star);
  background:radial-gradient(ellipse at 20% 0%,#6a4a8c,transparent 60%),linear-gradient(180deg,var(--side),var(--side2));
  transform:translateX(-102%);transition:transform .35s cubic-bezier(.2,.7,.2,1);
  padding:calc(24px + env(safe-area-inset-top,0px)) 14px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px;scrollbar-width:thin}
.side.open{transform:none;box-shadow:24px 0 60px rgba(30,15,45,.4)}
@media(min-width:1000px){.side{position:sticky;top:0;height:100vh;width:auto;transform:none}}
.side>*{position:relative;z-index:1}
.tw{position:absolute;z-index:0!important;border-radius:50%;background:#fff;animation:tw 5s infinite ease-in-out;pointer-events:none}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.8}}
.brand{display:flex;align-items:center;justify-content:space-between;padding:0 8px;font:500 10.5px var(--mono);letter-spacing:3px;text-transform:uppercase;color:var(--glow)}
.brand span{display:flex;gap:10px;align-items:center}
.brand svg{width:18px;height:18px}
.x{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:none;cursor:pointer;color:var(--mist)}
.x svg{width:16px;height:16px}
@media(min-width:1000px){.x{display:none}}
.who{padding:0 8px}
.who b{display:block;font:400 32px/1.1 var(--serif);color:#fff}
.who span{font:10.5px var(--mono);letter-spacing:1.8px;text-transform:uppercase;color:var(--mist)}
.mini{width:100%;text-align:left;cursor:pointer;border:1px solid rgba(239,213,157,.25);border-radius:18px;padding:12px 14px 14px;background:rgba(255,255,255,.06);display:flex;flex-direction:column;gap:8px}
.mini .row{display:flex;justify-content:space-between;font:10.5px var(--mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--mist)}
.mini b{color:var(--glow);font-weight:500}
.bar{height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lav),var(--glow))}
.grp{font:10px var(--mono);letter-spacing:2.6px;text-transform:uppercase;color:var(--glow);opacity:.85;padding:14px 10px 6px}
.grp small{display:block;font-size:9.5px;letter-spacing:1px;text-transform:none;color:var(--mist);opacity:.85;margin-top:2px}
.mi{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;cursor:pointer;text-align:left;padding:7px 8px;border-radius:14px;color:var(--mist);transition:background .2s}
.mi:hover{background:rgba(255,255,255,.07);color:#fff}
.mi[aria-current]{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1px rgba(239,213,157,.35)}
.gl{position:relative;flex:0 0 38px;height:38px;border-radius:50%;display:grid;place-items:center}
.gl svg{width:18px;height:18px}
.own .gl{background:radial-gradient(circle at 35% 30%,#f8e7c4,#c9a25e);color:var(--side2);box-shadow:0 0 18px rgba(239,213,157,.35)}
.part .gl{border:1px solid var(--lav);color:#efe6fa}
.lock .gl{border:1px dashed rgba(210,196,226,.5);color:rgba(210,196,226,.75)}
.rec .gl{border:1.5px solid var(--glow);color:var(--glow);animation:ring 3s ease-in-out infinite}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(239,213,157,.45)}50%{box-shadow:0 0 0 6px rgba(239,213,157,0)}}
/* ladder arrows between reading icons */
.chain .gl::after{content:"";position:absolute;left:50%;top:calc(100% + 2px);height:12px;border-left:1.5px dashed rgba(210,196,226,.5)}
.chain .gl::before{content:"";position:absolute;left:calc(50% - 3.5px);top:calc(100% + 9px);width:6px;height:6px;border:solid rgba(210,196,226,.7);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.chain.own .gl::after{border-left-style:solid;border-color:var(--glow)} .chain.own .gl::before{border-color:var(--glow)}
.lk{position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:50%;background:var(--side2);border:1px solid rgba(210,196,226,.4);display:grid;place-items:center}
.lk svg{width:9px;height:9px}
.mt{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.3}
.mt b{font-weight:400;font-size:15px}
.own .mt b,.rec .mt b{color:#fff}
.mt small{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font:9.5px var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--side2);background:var(--glow);border-radius:20px;padding:2px 8px;white-space:nowrap}
.side-foot{margin-top:auto;padding:16px 10px 0;border-top:1px solid rgba(255,255,255,.1);font-size:12.5px;line-height:1.55;color:var(--mist)}
.scrim{position:fixed;inset:0;background:rgba(43,31,56,.45);z-index:25;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.col{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:rgba(248,244,251,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--rule)}
@media(min-width:1000px){.top{display:none}}
.menu-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--card);border-radius:30px;padding:8px 14px 8px 12px;cursor:pointer;font-size:14px}
.menu-btn svg{width:17px;height:17px}
.top .t{font:18px var(--serif);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .s{font:11px var(--mono);color:var(--plum)}
.readbar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--lav),var(--plum2));z-index:40}
.sample{font:10.5px var(--mono);letter-spacing:2px;text-transform:uppercase;text-align:center;color:var(--plum);background:var(--bg2);padding:7px 16px}
main{width:100%;max-width:900px;margin:0 auto;padding:32px 18px 80px}
@media(min-width:1000px){main{padding:52px 56px 100px}}
.view{display:flex;flex-direction:column;gap:40px;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}

/* type + buttons */
.eyebrow{font:11px var(--mono);letter-spacing:3px;text-transform:uppercase;color:var(--plum2)}
.h2{font-size:clamp(28px,4.6vw,42px);line-height:1.14;text-wrap:balance}
.h2 em{color:var(--plum2)}
.h3{font-size:23px;line-height:1.3}
.head{display:flex;flex-direction:column;gap:12px}
.lede{color:var(--soft);max-width:60ch}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.pill{font:11.5px var(--mono);letter-spacing:.8px;padding:5px 12px;border-radius:30px;background:var(--card);border:1px solid var(--rule);color:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:500;font-size:15px;color:#fff;background:var(--plum);border:0;border-radius:40px;padding:14px 24px;cursor:pointer;text-decoration:none;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-1px);background:var(--plum2)}
.btn svg{width:16px;height:16px}
.btn.gold{background:linear-gradient(135deg,#d2ad68,#a07a37)}
.btn.ghost{background:var(--card);color:var(--plum);box-shadow:inset 0 0 0 1px var(--rule)}
.btn.sm{padding:9px 16px;font-size:14px}
.link{background:none;border:0;padding:0;cursor:pointer;color:var(--plum2);font-size:15px;text-decoration:underline;text-underline-offset:3px}
.row-btns{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.until{font:11.5px var(--mono);letter-spacing:.8px;color:var(--dim)}
.box{background:var(--card);border:1px solid var(--rule);border-radius:22px;padding:24px}

/* landing */
.hero{position:relative;overflow:hidden;border-radius:28px;color:var(--star);min-height:360px;display:flex;align-items:flex-end;
  background:linear-gradient(135deg,#7a56a2,#55387a 55%,#432b62);box-shadow:0 40px 70px -40px rgba(70,48,95,.7)}
.hero .bg,.lockhero .bg{position:absolute;inset:0}
.hero .bg svg,.lockhero .bg svg{width:100%;height:100%}
.hero .in{position:relative;padding:clamp(26px,5vw,46px);display:flex;flex-direction:column;gap:16px;max-width:560px}
.hero .eyebrow{color:var(--glow)}
.quote{font:italic 400 clamp(27px,4.6vw,42px)/1.24 var(--serif);color:#fff;text-wrap:balance;animation:rise 1s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.qfrom{font-size:14px;color:var(--mist)}
.again{align-self:flex-start;display:inline-flex;gap:8px;align-items:center;border:1px solid rgba(239,213,157,.45);background:rgba(255,255,255,.08);color:var(--glow);border-radius:30px;padding:8px 14px;cursor:pointer;font:11px var(--mono);letter-spacing:1.4px;text-transform:uppercase}
.again svg{width:14px;height:14px}
.stats{display:flex;flex-wrap:wrap;gap:8px 24px;font:11px var(--mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--mist)}
.stats b{color:var(--glow);font-weight:500;font-size:13px}
.letter{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:24px;padding:30px 30px 26px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh)}
.letter::before{content:"";position:absolute;inset:0 0 auto;height:4px;border-radius:24px 24px 0 0;background:linear-gradient(90deg,var(--lav),var(--rose),var(--glow))}
.letter p{font:italic 400 20px/1.6 var(--serif)}
.letter .sig{font-size:24px;color:var(--plum)}
.latest{display:grid;grid-template-columns:minmax(0,1fr);border-radius:24px;overflow:hidden;background:var(--card);border:1px solid var(--rule)}
@media(min-width:720px){.latest{grid-template-columns:42% minmax(0,1fr)}}
.latest .art{min-height:180px;aspect-ratio:auto;border-radius:0;height:100%}
.latest .in{padding:26px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.skybox{border-radius:28px;padding:clamp(22px,4vw,34px);background:linear-gradient(160deg,#4f3570,#3a2655);color:var(--star);display:flex;flex-direction:column;gap:14px}
.skybox .eyebrow{color:var(--glow)} .skybox .h2{color:#fff} .skybox .h2 em{color:var(--glow)} .skybox .lede{color:var(--mist)}
.sky-wrap{overflow-x:auto;scrollbar-width:none}
.sky-wrap svg{min-width:540px;width:100%;height:auto}
.swipe{display:none;font:10.5px var(--mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--mist)}
@media(max-width:600px){.swipe{display:block}}
.cons .ln{stroke:rgba(210,196,226,.35);stroke-dasharray:3 5}
.cons .ln.on{stroke:var(--glow);stroke-dasharray:none;opacity:.7}
.cons .st{cursor:pointer}
.cons .c{fill:none;stroke:rgba(210,196,226,.7);stroke-width:1.3}
.cons .on .c{fill:var(--glow);stroke:var(--glow)}
.cons .h{fill:transparent}
.cons .on .h{fill:var(--glow);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.1}50%{opacity:.28}}
.cons .lb{font:10px var(--mono);letter-spacing:1px;text-transform:uppercase;fill:rgba(210,196,226,.7)}
.cons .on .lb{fill:var(--glow)}
.cons .gp{font:italic 14px var(--serif);fill:#e5dbf2;opacity:.7}
.picture{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px}
.pc{text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--rule);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;transition:transform .2s,box-shadow .2s}
.pc:hover,.topic.on:hover,.banner:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--lav2);color:var(--plum)}
.ico svg{width:19px;height:19px}
.pc .t,.k{font:10.5px var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.pc .v{font:28px/1.05 var(--serif)}
.pc .v small{font-size:15px;color:var(--dim)}
.pc .d{font-size:14.5px;color:var(--soft);line-height:1.5}
.pips{display:flex;gap:5px}
.pips i{flex:1;height:3px;border-radius:3px;background:var(--rule)}
.pips i.on{background:var(--plum2)}
.next{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding:28px;border-radius:24px;background:linear-gradient(135deg,var(--lav2),#fbf3ea);border:1px solid var(--rule)}
@media(min-width:700px){.next{grid-template-columns:minmax(0,1fr) auto;align-items:center}}
.next .door{font:italic 22px/1.45 var(--serif);margin-top:8px}
.next .fine{font-size:15px;color:var(--soft);margin-top:10px}
.next .act{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.rung{display:flex;flex-direction:column;gap:14px}
.rung-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 14px;border-bottom:1px solid var(--rule);padding-bottom:10px}
.rung-head b{font:400 22px var(--serif)}
.rung-head span{font:11px var(--mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
.rung-head span.lit{color:var(--plum2)}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.topic{text-align:left;cursor:pointer;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;border:1px dashed #d9cbe6;background:none;transition:all .2s}
.topic .k{display:flex;gap:8px;align-items:center}
.topic .k svg{width:13px;height:13px}
.topic .v{font:19px/1.3 var(--serif);color:var(--soft)}
.topic .d{font-size:14.5px;color:var(--dim);line-height:1.5}
.topic.on{border:1px solid var(--rule);background:var(--card)}
.topic.on .k{color:var(--plum2)} .topic.on .v{color:var(--ink)} .topic.on .d{color:var(--soft)}
.flash{box-shadow:0 0 0 2px var(--plum2)!important}

/* reading */
.art{border-radius:24px;overflow:hidden;aspect-ratio:16/6;min-height:150px}
.art svg{width:100%;height:100%}
.contents ol{list-style:none;margin:10px 0 0;padding:0;counter-reset:c}
.contents li{counter-increment:c;border-top:1px solid var(--rule)}
.contents li:first-child{border:0}
.contents button{display:flex;gap:14px;align-items:baseline;width:100%;background:none;border:0;padding:10px 0;cursor:pointer;text-align:left;font-size:16.5px}
.contents button::before{content:counter(c,decimal-leading-zero);font:11px var(--mono);color:var(--lav);flex:0 0 22px}
.contents button:hover{color:var(--plum2)}
.contents,.rd{max-width:66ch}
.rd{display:flex;flex-direction:column;gap:20px}
.rd p{font-size:18px;line-height:1.85;color:#332742}
.rd em{color:var(--plum2)}
.r-h2{font-size:clamp(27px,4vw,36px);line-height:1.2;margin-top:34px;padding-top:34px;border-top:1px solid var(--rule);scroll-margin-top:84px;position:relative}
.r-h2::before{content:"\2726";position:absolute;top:-11px;left:0;background:var(--bg);padding-right:12px;font:14px var(--sans);color:var(--lav)}
.r-h3{font-weight:500;font-size:22px;color:var(--plum)}
.r-label{font:11px var(--mono);letter-spacing:2.6px;text-transform:uppercase;color:var(--plum2)}
.rd .r-sub{font:italic 19.5px/1.5 var(--serif);color:var(--plum)}
.rd .r-pull{padding:26px 6px;font:italic clamp(22px,3.4vw,27px)/1.45 var(--serif);text-align:center;text-wrap:balance;color:var(--ink);border-block:1px solid var(--rule)}
.rd .r-small{font-size:14px;color:var(--dim)}
.cards{display:flex;flex-wrap:wrap;gap:8px}
.tc{display:inline-flex;align-items:center;gap:9px;padding:6px 13px 6px 7px;border-radius:12px;border:1px solid var(--rule);background:var(--card);font-size:14.5px}
.tc i{width:14px;height:21px;border-radius:3px;border:1px solid var(--glow);background:linear-gradient(160deg,#7a56a2,#432b62)}
.tc small{font:9.5px var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--rose)}
.syms{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.sym{border:1px solid var(--rule);border-radius:18px;padding:18px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.sym b{font:400 19px var(--serif)}
.sym span{font-size:15.5px;color:var(--soft);line-height:1.6}
.after{position:relative;overflow:hidden;border-radius:26px;padding:clamp(24px,4vw,36px);color:var(--star);background:radial-gradient(ellipse at 90% 0%,rgba(239,213,157,.28),transparent 55%),linear-gradient(150deg,#6a4790,#432b62);display:flex;flex-direction:column;gap:14px}
.after .eyebrow{color:var(--glow)} .after .h2{color:#fff} .after p{color:var(--mist);max-width:56ch}
.after .door{font:italic 21px/1.5 var(--serif);color:#fff}
.after .link{color:var(--glow)}
.pager{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;padding-top:30px;border-top:1px solid var(--rule)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;display:inline-flex;align-items:center;gap:8px;font:11px var(--mono);letter-spacing:1.5px;text-transform:uppercase;color:#fff;background:var(--plum);border:0;border-radius:30px;padding:12px 18px;cursor:pointer;box-shadow:var(--sh)}
.fab svg{width:15px;height:15px;color:var(--glow)}

/* locked */
.lockhero{position:relative;border-radius:26px;overflow:hidden;min-height:220px;display:flex;align-items:flex-end;color:#fff}
.lockhero .in{position:relative;padding:clamp(22px,4vw,36px);display:flex;flex-direction:column;gap:8px}
.lockhero .eyebrow{color:var(--glow)}
.promise{font:italic 19px/1.45 var(--serif);color:#efe6fa}
.unlock{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media(min-width:780px){.unlock{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ub{border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ub .t{font:10.5px var(--mono);letter-spacing:2px;text-transform:uppercase}
.ub ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:15.5px;line-height:1.5}
.ub ul li{display:flex;gap:10px}
.get{background:var(--card);border:1px solid var(--rule)} .get .t{color:var(--plum2)} .get li::before{content:"\2726";color:var(--gold)}
.miss{background:#f8eef1;border:1px dashed #e5c9d1} .miss .t{color:var(--rose)} .miss li::before{content:"\25CB";color:var(--rose)}
.how{background:linear-gradient(160deg,#5b3a7c,#432b62);color:var(--star)} .how .t{color:var(--glow)}

    keyhole: u => sky(u, '#8e6ab6', '#553878', '#3a2655') + dots(55, 640, 260, 9) + '<circle cx="520" cy="96" r="80" fill="#efd59d" opacity=".12"/><path d="M520 62a22 22 0 0 1 12 40l7 36h-38l7-36a22 22 0 0 1 12-40z" fill="none" stroke="#efd59d" stroke-width="1.5"/>'
  };
  const art = (n, al = 'xMid') => `<svg viewBox="0 0 640 260" preserveAspectRatio="${al}YMid slice" aria-hidden="true">${ART[n](++uid)}</svg>`;

  /* "where your story goes next": after a reading, never inside it */
  const after = () => `<section class="after"><span class="eyebrow">Where your story goes next</span><h2 class="h2">${NO.label || 'Your next step'}</h2><p class="door">${NX.door}</p><p>${NX.fine}</p>
    <div class="row-btns">${cta(Object.assign({}, NO, { go: NX.go }))}<button class="link" type="button" data-go="clarity">Or work with me 1:1, at any step</button></div><span class="until" style="color:var(--mist)">${NX.until}</span></section>`;

  /* full reading: renders every block, never changes the words */
  function reading(id) {
    const r = READ[id], b = r.text || []; let html = '', toc = [], n = 0, i = 0, words = 0;
    const wc = s => plain(s || '').split(/\s+/).filter(Boolean).length;
    b.forEach(x => words += wc(x.h) + wc((x.items || []).join(' ')));
    while (i < b.length) {
      const x = b[i];
      if (x.t === 'h2' || x.t === 'h3') { const sid = id + '-s' + n++; if (x.t === 'h2') toc.push([sid, plain(x.h)]); html += `<${x.t} class="r-${x.t}" id="${sid}">${x.h}</${x.t}>`; }
      else if (x.t === 'symbol' || x.t === 'symdesc') { let g = '';
        while (i < b.length && /^sym/.test(b[i].t)) { const d = b[i + 1]; if (b[i].t === 'symbol' && d && d.t === 'symdesc') { g += `<div class="sym"><b>${b[i].h}</b><span>${d.h}</span></div>`; i++; } else g += `<div class="sym"><b>${b[i].h}</b></div>`; i++; }
        html += `<div class="syms">${g}</div>`; continue; }
      else if (x.t === 'cards') html += `<div class="r-label">Cards pulled</div><div class="cards">${x.items.map(c => `<span class="tc"><i></i>${c.replace(' reversed', '')}${/reversed/.test(c) ? ' <small>reversed</small>' : ''}</span>`).join('')}</div>`;
      else if (x.t === 'label') html += `<div class="r-label">${x.h}</div>`;
      else if (x.t === 'list') html += `<ul>${li(x.items)}</ul>`;
      else html += `<p class="${x.t === 'body' ? '' : 'r-' + x.t}">${x.h}</p>`;
      i++;
    }
    html = html.replace(/(https:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    const next = owned[owned.indexOf(id) + 1];
    return `<div class="art">${art(r.art)}</div>
      <div class="head"><div class="eyebrow">${r.eyebrow}</div><h2 class="h2">${r.title}</h2>
        <div class="meta">${r.pills.map(p => `<span class="pill">${p}</span>`).join('')}<span class="pill">${words.toLocaleString()} words · ${Math.max(1, Math.round(words / 220))} min read</span></div>
        <div class="row-btns" data-resume-box="${id}" hidden><button class="btn" type="button" data-resume="${id}">${ic('arrow')}Continue where you left off</button><span class="until"></span></div></div>
      <nav class="contents box" id="contents-${id}"><span class="eyebrow">In this reading · ${toc.length} sections</span><ol>${toc.map(t => `<li><button type="button" data-jump="${t[0]}">${t[1]}</button></li>`).join('')}</ol></nav>
      <div class="rd" id="text-${id}">${html}</div>
      ${after()}
      <div class="pager"><button class="btn ghost" type="button" data-go="map">${ic('back')}Back to your map</button>${next ? `<button class="btn ghost" type="button" data-go="${next}">Next: ${READ[next].name}${ic('arrow')}</button>` : ''}</div>`;
  }

  /* locked page: always the same three boxes */
  const unlock = o => `<div class="lockhero"><div class="bg">${art('keyhole')}</div><div class="in"><div class="eyebrow">${o.eyebrow}</div><h2 class="h2">${o.label}</h2><p class="promise">${o.promise}</p>
      ${o.whispers ? `<div class="whispers" aria-label="Questions this answers">${o.whispers.map(w => `<span>“${w}”</span>`).join('')}</div>` : ''}</div></div>
    ${o.inside ? `<div class="head"><span class="eyebrow">Sealed inside</span><h2 class="h2">${o.insideTitle}</h2></div>

      <div class="ub miss"><span class="t">What's missing from your map</span><ul>${li(o.miss || missing(o.stars).concat(o.extraMiss || []))}</ul></div>
      <div class="ub how"><span class="t">How to unlock it</span><div class="price">${o.price}<small>${o.priceNote}</small></div><ol>${li(o.steps)}</ol>${cta(o)}
        <a class="link" href="${mail('A question about ' + o.label, 'Hi Luana,\n\nI have a question about ' + o.label + ':\n\n\n' + CLIENT.name)}">Not sure it's right for you? Ask me first</a></div></div>

  /* landing sections (order set in CLIENT.landing) */
  const day = Math.floor(Date.now() / 864e5);
  let msgI = (day + (parseInt(store.get('msg-' + day)) || 0)) % CLIENT.messages.length;
  const pc = (go, icon, t, v, n, on, d) => `<button class="pc" type="button" data-go="${go}"><span class="ico">${ic(icon)}</span><span class="t">${t}</span><span class="v">${v}</span><span class="pips">${'<i class="on"></i>'.repeat(on)}${'<i></i>'.repeat(n - on)}</span><span class="d">${d}</span></button>`;
  const VAULT = SEASONAL.filter(s => !s.needs || READ[s.needs]), ownedSeason = VAULT.filter(s => s.cls === 'owned').length;
  const hasGift = VAULT.some(s => s.cls === 'gift'), soon = VAULT.find(s => s.opens);
  const days = d => Math.max(0, Math.ceil((Date.parse(d) - Date.now()) / 864e5));
  const L = {
    hero: () => `<section class="hero"><div class="bg">${art('union', 'xMax')}</div><div class="in"><div class="eyebrow">Welcome back, ${CLIENT.name}</div>

    note: () => `<section class="letter"><span class="eyebrow">A note from Luana</span><p>${CLIENT.note}</p><p class="sig">With love, Luana</p></section>`,
    latest: () => { const r = READ[CLIENT.latest]; return `<section class="latest"><div class="art">${art(r.art)}</div><div class="in"><span class="eyebrow">Your newest reading${r.tag ? ' · ' + r.tag : ''}</span><h2 class="h2">${r.title}</h2><p class="lede">${r.blurb}</p><div class="row-btns" id="latestBtn"></div></div></section>`; },
    sky: () => `<section class="skybox"><span class="eyebrow">Your constellation</span><h2 class="h2">The Connection Map <em>for ${CLIENT.name}</em></h2><p class="lede">Each reading lights stars. Tap one to see what Spirit showed you there.</p><div class="sky-wrap"><svg class="cons" id="sky" viewBox="0 0 660 340" role="img" aria-label="Your constellation of twelve topics"></svg></div><span class="swipe">Swipe to see all your stars →</span></section>`,
    picture: () => `<div class="head"><span class="eyebrow">The complete picture</span><h2 class="h2">Everything available <em>to you</em></h2></div><div class="picture">
      ${pc(owned[0], 'spark', 'Readings', `${owned.length} <small>of 5</small>`, 5, owned.length, owned.map(o => READ[o].name).join(' and ') + (owned.length > 1 ? ' are yours.' : ' is yours.'))}
      ${pc('vault', 'gem', 'Seasonal', `${ownedSeason} <small>of 3</small>`, 3, ownedSeason, (hasGift ? 'A sealed bonus only October clients receive is waiting. ' : '') + (soon ? soon.name + ' opens ' + soon.when.replace('Opens ', '') + '.' : ''))}
      ${pc('clarity', 'chat', 'Coaching', `${CLIENT.calls} <small>calls</small>`, 2, 0, 'Open to you at any step. Your 90-day plan is drafted.')}
      ${pc('academy', 'book', 'Academy', CLIENT.academy.joined ? 'Joined' : 'Not joined', 1, CLIENT.academy.joined ? 1 : 0, 'Finish Manifest Your Union, earn a free reading.')}</div>`,
    next: () => `<div class="next"><div><span class="eyebrow">Your next star</span><p class="door">${NX.door}</p><p class="fine">${NX.fine}</p></div><div class="act">${cta(Object.assign({}, NO, { go: NX.go }))}<span class="until">${NX.until}</span></div></div>`,
    rungs: () => [['First Light', 'feelings', ['now']], ['The Heart Map', 'heart', OFFERS.heart.stars], ['The Union Blueprint', 'blueprint', OFFERS.blueprint.stars], ['The Union Pathway', 'pathway', OFFERS.pathway.stars]].map(([nm, page, ids]) => {
      const got = ids.length - missing(ids).length;
      return `<div class="rung"><div class="rung-head"><b>${nm}</b><span class="${got ? 'lit' : ''}">${got} of ${ids.length} revealed</span></div><div class="topics">${ids.map(id => { const t = T(id);
        return `<button type="button" class="topic ${t.by ? 'on' : ''}" id="topic-${id}" data-go="${t.by || page}"><span class="k">${ic(t.by ? 'spark' : 'lock')}${t.by ? 'From ' + READ[t.by].name : 'Not yet read'}</span><span class="v">${t.name}</span><span class="d">${t.by ? t.ans : t.q}</span></button>`; }).join('')}</div></div>`; }).join('')
  };

  /* course: locked lessons, or tick-off progress once she has joined */
  const course = () => { const j = CLIENT.academy.joined, done = (store.get('course') || '').split(','); let n = 0;
    return `<div class="head"><span class="eyebrow">Inside the course</span><h2 class="h2">Manifest Your Union, <em>lesson by lesson</em></h2><p class="lede">${j ? 'Tick each lesson as you finish it and its workbook page. Your progress saves on this device.' : 'Start with the Union Block quiz, then move through one lesson and one integration activity a week. Healing is not a race.'}</p></div>
    <div class="mods">${COURSE.map(([m, ls], mi) => `<div class="mod box"><span class="eyebrow">Module ${mi + 1}</span><h3 class="h3">${m}</h3><ol>${ls.map(([t, d]) => { const k = 'L' + n++, on = done.includes(k);
      return `<li>${j ? `<button class="ck ${on ? 'done' : ''}" type="button" data-lesson="${k}" aria-label="Mark ${t} complete">${ic('check')}</button>` : `<span class="ck">${ic('lock')}</span>`}<div><b>${t}</b><span>${d}</span></div></li>`; }).join('')}</ol></div>`).join('')}</div>
    <div class="reward"><div class="seal">${ic('spark')}</div><div class="head"><span class="eyebrow">The course reward</span><h3 class="h3">Finish the work, receive a reading</h3><p>I want to support the women who are doing the work. When you complete every lesson of Manifest Your Union, email me your finished workbook pages and I'll send you a complimentary reading as a thank you.</p>
      <ol style="margin:0;padding-left:20px"><li>Complete all lessons and every workbook page</li><li>Email your pages to <span style="font-family:var(--mono);color:var(--glow)">${EMAIL}</span> with the subject "Manifest Your Union complete"</li><li>I review your work and send your reading booking link</li></ol></div></div>`; };
  OFFERS.academy.extra = course();

  /* "which reading is right for me" email: short qualifying fields, all optional. Asks what she wants clarity on, never details about the other person. */
  const FORM = [
    ['clarity', 'What I most want clarity on right now', 'text', 'In a few words, for example: whether to reach out'],
    ['long', 'How long I have been carrying this', ['A few weeks', 'A few months', 'Over a year', 'Several years']],
    ['about', 'This is mostly about', ['A specific connection', 'Calling in new love', 'My own energy and healing', 'Something else']],
    ['format', 'What feels right to me', ['A written reading', 'Working with you 1:1', 'Not sure yet']],
    ['budget', 'A comfortable investment for me right now', ['Under $100', 'Around $222', '$555 to $777', 'Open to your suggestion']],
    ['when', 'How soon I would love guidance', ['This week', 'This month', 'No rush']]];
  const formHtml = () => FORM.map(([k, label, kind, ph]) => kind === 'text'
    ? `<div class="field"><label for="f-${k}">${label}</label><input type="text" id="f-${k}" data-key="f-${k}" maxlength="200" placeholder="${ph}"></div>`
    : `<div class="field"><label>${label}</label><div class="pick" role="group" aria-label="${label}">${kind.map(v => `<button type="button" data-pick="${k}" data-val="${v}" aria-pressed="${store.get('f-' + k) === v}">${v}</button>`).join('')}</div></div>`).join('');

  const qList = () => JSON.parse(store.get('qs') || '[]');
  const fv = k => store.get('f-' + k).trim();
  const MAILPART = {
    to: () => EMAIL,
    subject: () => `Which reading is right for me? · ${CLIENT.name}`,
    body: () => { const qs = qList();
      return `Hi Luana,\n\nI'd love your help choosing the right reading or session for me.\n\n`
        + FORM.map(([k, label]) => `${label}: ${fv(k)}`).join('\n')
        + `\n\nThe questions I'm holding:\n${qs.length ? qs.map(q => '• ' + q).join('\n') : '• '}\n\nThank you,\n${CLIENT.name}\n(Sent from my Connection Map)`; },
    all: () => `To: ${EMAIL}\nSubject: ${MAILPART.subject()}\n\n${MAILPART.body()}` };
  /* questions she is holding: each one can be emailed to Luana */
  const askMail = q => mail(`A question for Spirit from ${CLIENT.name}`, `Hi Luana,\n\nI'd love to ask Spirit this in a reading:\n\n"${q}"\n\nWhich reading would you recommend for me?\n\n${CLIENT.name}`);
  const held = () => { const qs = JSON.parse(store.get('qs') || '[]');
    return qs.length ? qs.map((q, i) => `<div class="box"><p class="q">“${esc(q)}”</p><div class="row-btns"><a class="btn sm" href="${askMail(q)}">${ic('mail')}Ask Spirit this in a reading</a><button class="link" type="button" data-delq="${i}">Remove</button></div></div>`).join('') : '<p class="lede">Your questions will appear here.</p>'; };

  /* custom pages */
  const V = {
    map: () => CLIENT.landing.map(s => L[s]()).join(''),
    vault: () => `<div class="head"><span class="eyebrow">The seasonal vault</span><h2 class="h2">Readings that open <em>with the portals</em></h2><p class="lede">Seasonal readings only open during their window. Tap a card to look inside.</p></div>
      <div class="vault">${VAULT.map((s, i) => `<button type="button" class="banner ${s.cls}" data-vault="${i}" aria-expanded="false"><div class="art">${art(s.art)}<span class="stamp">${s.opens ? (days(s.opens) ? `Opens in ${days(s.opens)} days` : 'Open now') : s.stamp}</span></div><div class="body"><b>${s.name}</b><span class="k">${s.when}</span></div></button>`).join('')}</div><div id="vault-detail"></div>`,
    plan: () => `<div class="head"><span class="eyebrow">Your 90-day plan · draft</span><h2 class="h2">From your readings <em>to real change</em></h2><p class="lede">I started this plan from what came through in your readings. Fill in the blanks in your own words. We finish it together on your Soul Clarity Session. Your answers save on this device.</p></div>
      <div class="phases">${PLAN.map((p, i) => `<div class="ph box"><span class="eyebrow">${p[0]}</span><span class="v">${p[1]}</span><p class="from">From your readings: ${p[2]}</p><label for="p${i}">${p[3]}</label><textarea id="p${i}" data-key="p${i}"></textarea></div>`).join('')}</div>
      <div class="head"><h3 class="h3">What we would talk about on our call</h3><label for="pcall">The one thing I most want to shift in the next 90 days is…</label><textarea id="pcall" data-key="pcall"></textarea></div>
      <div class="next"><div><span class="eyebrow">Bring this plan to life</span><p class="door">Sixty minutes, one plan, and a clear path forward.</p></div><div class="act">${cta(OFFERS.clarity)}<span class="until">$333 · one-time introductory call</span></div></div>`,
    calls: () => `<div class="head"><span class="eyebrow">Coaching · your call history</span><h2 class="h2">Every call, <em>kept here</em></h2><p class="lede">When we work together, each call is saved on this page: the replay, the transcript, what we uncovered, and your next steps. Here is what one looks like.</p></div>
      <div class="box" style="display:grid;gap:12px;opacity:.7"><div class="meta"><span class="pill">Session 1</span><span class="pill">Replay</span><span class="pill">Transcript</span><span class="pill">Next steps</span></div><div class="ghost" style="width:60%"></div><div class="ghost" style="width:90%"></div><div class="ghost" style="width:75%"></div></div>
      <div class="next"><div><span class="eyebrow">Your first call</span><p class="door">Coaching is open to you at any step of your journey.</p><p class="fine">Your first call record appears here after your Soul Clarity Session.</p></div><div class="act">${cta(OFFERS.clarity)}</div></div>`,
    questions: () => `<section class="ask"><span class="eyebrow">What is your heart still asking?</span><h2 class="h2">Write it here. <em>Every question you hold is one Spirit can answer.</em></h2>
        <p class="lede">The questions that keep you up at night, the ones you're almost afraid to ask. Write them down, then send any of them to me and I'll tell you which reading will answer it best.</p>
        <div class="addrow"><input type="text" id="newq" maxlength="300" placeholder="What does she feel when she thinks of me?" aria-label="Your question"><button class="btn" type="button" id="addq">Hold this question</button></div></section>
      <div class="held" id="held">${held()}</div>
      <section class="ask helper"><span class="eyebrow">Ready for your answers?</span><h2 class="h2">Send them to me, <em>and I'll point you to the right reading</em></h2>
        <p class="lede">Your email is already written. Tap what fits, skip anything you like, and I'll reply personally with the reading or session that will answer what you're holding.</p>
        <ol class="steps3"><li><span>Tap the answers that fit below. Everything is optional.</span></li><li><span>Tap <b>Open my email</b>. Your message is ready, just press send.</span></li><li><span>Email didn't open? Tap <b>Copy</b> on each part and paste it into any email.</span></li></ol>
        ${formHtml()}
        <p class="evid">No need to tell me details about the other person. I'm an evidential reader, so I'd rather Spirit show me.</p>
        <div class="mailbox" aria-label="Your email, ready to send">
          <div class="mrow"><span class="k">To</span><span class="v">${EMAIL}</span><button class="copy" type="button" data-copy="to">Copy</button></div>
          <div class="mrow"><span class="k">Subject</span><span class="v">${MAILPART.subject()}</span><button class="copy" type="button" data-copy="subject">Copy</button></div>
          <div class="mrow"><span class="k">Message</span><pre id="mBody"></pre><button class="copy" type="button" data-copy="body">Copy</button></div></div>
        <div class="row-btns"><a class="btn gold" id="sendAll" href="#">${ic('mail')}Open my email</a><button class="btn ghost sm" type="button" data-copy="all">${ic('copy')}Copy everything</button></div>
        <span class="until">I reply personally, Monday to Friday</span></section>
      <div class="head"><span class="eyebrow">Already answered</span><h2 class="h2">What Spirit has <em>shown you</em> so far</h2></div>
      <div class="qa">${owned.slice().reverse().map(id => `<button type="button" class="box" data-go="${id}"><span class="eyebrow">${READ[id].name} · ${READ[id].date}</span><span class="q">${READ[id].q}</span><span class="a">${READ[id].a}</span></button>`).join('')}</div>`
  };

  /* menu: readings run as a personal ladder (owned → her next step → the rest), with arrows between */
  const offerRow = (id, cls = 'lock') => { const o = OFFERS[id], w = o.stars ? missing(o.stars).length : 0; return [id, o.label, o.icon, id === NX.go ? 'rec' : cls, o.sub || `${w} star${w === 1 ? '' : 's'} waiting`, id === NX.go ? 'For you' : '']; };
  const ladder = ['heart', 'blueprint', 'pathway'].sort((a, b) => (b === NX.go) - (a === NX.go));
  const NAV = [['Your map', '', [['map', 'The full picture', 'map', 'own', 'Everything in one place']]],
    ['Your readings', 'Your path, step by step', owned.map(id => [id, READ[id].name, READ[id].icon, 'own chain', 'Delivered ' + READ[id].date, READ[id].tag]).concat(ladder.map((id, i) => { const r = offerRow(id); if (i < ladder.length - 1) r[3] += ' chain'; return r; })).concat([['vault', 'Seasonal vault', 'gem', 'part', `${ownedSeason} of 3 collected`]])],
    ['Coaching', 'Open to you at any step', [offerRow('clarity'), ['plan', 'My 90-day plan', 'pen', 'part', 'Drafted from your readings'], offerRow('rewired'), ['calls', 'My calls', 'play', CLIENT.calls ? 'own' : 'lock', CLIENT.calls ? CLIENT.calls + ' saved' : 'Replays and next steps']]],
    ['Academy', '', [offerRow('academy', CLIENT.academy.joined ? 'own' : 'lock')]], ['You', '', [['questions', 'Your questions', 'mail', 'own', 'Ask Spirit anything']]]];

  /* build */
  const side = $('#side'), pages = $('#pages'), LABEL = {};
  let nav = '';
  NAV.forEach(([g, sub, items]) => { nav += `<div class="grp">${g}${sub ? `<small>${sub}</small>` : ''}</div>`; items.forEach(([id, label, icon, state, s, tag]) => { LABEL[id] = label;
    nav += `<button type="button" class="mi ${state}" data-go="${id}"><span class="gl">${ic(icon)}${/lock/.test(state) ? `<span class="lk">${ic('lock')}</span>` : ''}</span><span class="mt"><b>${label}</b><small>${s}</small></span>${tag ? `<span class="tag">${tag}</span>` : ''}</button>`;
    pages.insertAdjacentHTML('beforeend', `<section class="view" id="v-${id}" hidden>${READ[id] ? reading(id) : OFFERS[id] ? unlock(OFFERS[id]) : V[id]()}</section>`); }); });
  side.innerHTML = `<div class="brand"><span>${ic('spark')}Luana Spirits</span><span class="tools"><button class="theme" type="button" data-theme-toggle aria-label="Switch light or dark mode"></button><button class="x" id="closeMenu" type="button" aria-label="Close menu">${ic('close')}</button></span></div>
    <div class="who"><b>${CLIENT.name}</b><span>${CLIENT.since}</span></div>
    <button class="mini" type="button" data-go="map" aria-label="Open your constellation"><svg class="cons" id="miniSky" viewBox="0 0 660 340" aria-hidden="true"></svg><div class="row"><span><b>${lit}</b> of 12 stars</span><span>Your map</span></div><div class="bar"><i style="width:${lit / 12 * 100}%"></i></div></button>
    <nav>${nav}</nav><div class="side-foot">Your private space with Luana. Everything Spirit has shown you lives here, and it grows as you do.</div>`;
  for (let i = 0; i < 40; i++) { const s = document.createElement('span'), z = Math.random() * 1.8 + .5; s.className = 'tw'; s.style.cssText = `width:${z}px;height:${z}px;left:${Math.random() * 100}%;top:${Math.random() * 100}%;animation-delay:${Math.random() * 5}s`; side.appendChild(s); }
  $('#openMenu').innerHTML = ic('menu') + 'Menu'; $('#tbStars').textContent = '✦ ' + lit + '/12';

  /* constellations */
  const NS = 'http://www.w3.org/2000/svg', el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt) e.textContent = txt; return e; };
  function drawSky(svg, full) {
    if (!svg) return; const s = full ? 1 : 1.8;
    if (full) [['First Light', 30, 312], ['The Heart Map', 140, 102], ['The Union Blueprint', 330, 32], ['The Union Pathway', 510, 322]].forEach(([t, x, y]) => svg.appendChild(el('text', { x, y, class: 'gp' }, t)));
    TOPICS.slice(1).forEach((b, i) => { const a = TOPICS[i]; svg.appendChild(el('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: 'ln' + (a.by && b.by ? ' on' : ''), 'stroke-width': s })); });
    TOPICS.forEach(t => { const g = el('g', { class: 'st' + (t.by ? ' on' : '') }), { x, y } = t, d = 9 * s, e = 2.4 * s;
      g.appendChild(el('circle', { cx: x, cy: y, r: 16 * s, class: 'h' }));
      g.appendChild(t.by ? el('path', { class: 'c', d: `M${x} ${y - d}L${x + e} ${y - e}L${x + d} ${y}L${x + e} ${y + e}L${x} ${y + d}L${x - e} ${y + e}L${x - d} ${y}L${x - e} ${y - e}Z` }) : el('circle', { cx: x, cy: y, r: 5 * s, class: 'c', 'stroke-width': 1.3 * s }));
      if (full) { g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button'); g.setAttribute('aria-label', t.name); g.dataset.star = t.id; g.appendChild(el('text', { x, y: y + 28, 'text-anchor': 'middle', class: 'lb' }, t.name)); }
      svg.appendChild(g); });
  }
  drawSky($('#sky'), true); drawSky($('#miniSky'), false);

  /* saved notes */
  document.querySelectorAll('textarea[data-key],input[data-key]').forEach(t => { t.value = store.get(t.dataset.key); t.addEventListener('input', () => { store.set(t.dataset.key, t.value); if (t.dataset.key.startsWith('f-')) compose(); }); });

  /* light / dark */
  function setTheme(th) { document.documentElement.dataset.theme = th; try { localStorage.setItem('cm-theme', th); } catch (e) {}
    document.querySelectorAll('[data-theme-toggle]').forEach(b => { b.innerHTML = ic(th === 'dark' ? 'sun' : 'moon'); b.title = th === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'; }); }
  setTheme(document.documentElement.dataset.theme || 'light');

  /* daily message refresh */
  const again = $('#again'); if (again) again.onclick = () => { const k = (parseInt(store.get('msg-' + day)) || 0) + 1; store.set('msg-' + day, k); msgI = (day + k) % CLIENT.messages.length;
    const q = $('#quote'); q.style.animation = 'none'; q.offsetHeight; q.style.animation = ''; q.textContent = CLIENT.messages[msgI][0]; $('#qfrom').textContent = `Another message for you · from your ${CLIENT.messages[msgI][1]} reading`; };

  /* questions */
  function compose() { if (!$('#mBody')) return; $('#mBody').textContent = MAILPART.body(); $('#sendAll').href = mail(MAILPART.subject(), MAILPART.body()); }
  function copyText(txt) { const done = () => say('Copied ✦ Paste it into a new email to ' + EMAIL);
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, () => fallback());
    else fallback();
    function fallback() { const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0;top:0'; document.body.appendChild(ta); ta.focus(); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { say('Press and hold the text to copy it'); } ta.remove(); } }
  const saveQs = qs => { store.set('qs', JSON.stringify(qs)); $('#held').innerHTML = held(); compose(); };
  $('#addq').onclick = () => { const v = $('#newq').value.trim(); if (!v) return; saveQs(qList().concat(v)); $('#newq').value = ''; };
  $('#newq').onkeydown = e => { if (e.key === 'Enter') $('#addq').click(); };
  compose();

  /* drawer */
  const scrim = $('#scrim'), drawer = on => { side.classList.toggle('open', on); scrim.classList.toggle('on', on); $('#openMenu').setAttribute('aria-expanded', on); };
  $('#openMenu').onclick = () => drawer(true); $('#closeMenu').onclick = scrim.onclick = () => drawer(false);

  /* reading progress + resume */
  const bar = $('#readbar'), fab = $('#fab'); let cur = 'map', saveT;
  fab.innerHTML = ic('list') + 'Contents';
  const prog = id => { const t = $('#text-' + id); if (!t) return 0; return Math.min(1, Math.max(0, (innerHeight * .25 - t.getBoundingClientRect().top) / Math.max(1, t.offsetHeight - innerHeight * .6))); };
  const pos = id => parseFloat(store.get('pos-' + id)) || 0;
  addEventListener('scroll', () => { if (!READ[cur]) return; const p = prog(cur); bar.style.width = p * 100 + '%'; clearTimeout(saveT); saveT = setTimeout(() => p > .03 && store.set('pos-' + cur, p), 400); }, { passive: true });
  const resumeTo = id => { const t = $('#text-' + id); scrollTo({ top: t.getBoundingClientRect().top + scrollY + pos(id) * (t.offsetHeight - innerHeight * .6) - innerHeight * .25, behavior: 'smooth' }); };
  function refresh() {
    document.querySelectorAll('[data-resume-box]').forEach(b => { const p = pos(b.dataset.resumeBox); b.hidden = !(p > .05 && p < .95); b.querySelector('.until').textContent = Math.round(p * 100) + '% read'; });
    const lb = $('#latestBtn'); if (lb) { const p = pos(CLIENT.latest), mid = p > .05 && p < .95;
      lb.innerHTML = `<button class="btn" type="button" data-go="${CLIENT.latest}"${mid ? ' data-then="resume"' : ''}>${ic('arrow')}${mid ? 'Continue reading' : p >= .95 ? 'Read it again' : 'Open your reading'}</button>${mid ? `<span class="until">${Math.round(p * 100)}% read</span>` : ''}`; }
  }

  /* navigation */
  function show(id, resume) {
    if (!LABEL[id]) id = 'map'; cur = id;
    document.querySelectorAll('.view').forEach(v => v.hidden = v.id !== 'v-' + id);
    side.querySelectorAll('.mi').forEach(b => b.dataset.go === id ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
    $('#tbTitle').textContent = LABEL[id]; fab.hidden = !READ[id]; bar.style.width = 0; refresh(); drawer(false);
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
    resume ? setTimeout(() => resumeTo(id), 60) : scrollTo(0, 0);
  }
  const flashTopic = id => { const c = $('#topic-' + id); if (!c) return; c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.classList.add('flash'); setTimeout(() => c.classList.remove('flash'), 1500); };
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-jump],[data-resume],[data-star],[data-vault],[data-go],[data-delq],[data-lesson],[data-pick],[data-copy],[data-theme-toggle]'); if (!t) return;
    const d = t.dataset;
    if ('themeToggle' in d) setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    else if (d.pick) { const on = store.get('f-' + d.pick) === d.val; store.set('f-' + d.pick, on ? '' : d.val); t.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', !on && b === t)); compose(); }
    else if (d.copy) copyText(MAILPART[d.copy]());
    else if (d.jump) $('#' + d.jump).scrollIntoView({ behavior: 'smooth' });
    else if (d.resume) resumeTo(d.resume);
    else if (d.star) flashTopic(d.star);
    else if (d.delq) { const qs = qList(); qs.splice(+d.delq, 1); saveQs(qs); }
    else if (d.lesson) { const done = new Set((store.get('course') || '').split(',').filter(Boolean)); done.has(d.lesson) ? done.delete(d.lesson) : done.add(d.lesson); t.classList.toggle('done'); store.set('course', [...done].join(',')); }
    else if (d.vault) { const s = VAULT[d.vault]; document.querySelectorAll('[data-vault]').forEach(b => b.setAttribute('aria-expanded', b === t));
      const act = s.go ? `<button class="btn" type="button" data-go="${s.go}">Open my reading</button>`
        : s.url && s.cls !== 'dim' && !(s.opens && days(s.opens)) ? `<a class="btn gold" href="${s.url}" target="_blank" rel="noopener">Book ${s.name}${ic('arrow')}</a>`
        : s.notify ? `<a class="btn ghost" href="${mail('Tell me when ' + s.name + ' opens', 'Hi Luana,\n\nPlease let me know the moment ' + s.name + ' opens.\n\n' + CLIENT.name)}">${ic('mail')}Tell me the moment it opens</a>` : '';
      $('#vault-detail').innerHTML = `<div class="box head"><span class="eyebrow">${s.when}</span><h2 class="h2">${s.name}</h2><p class="lede">${s.blurb}</p><div class="chips">${s.parts.map(p => `<span class="chip ${s.go ? 'got' : ''}">${p}</span>`).join('')}</div>${act ? `<div class="row-btns">${act}</div>` : '<span class="until">You\'ll see it here first.</span>'}</div>`;
      $('#vault-detail').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
    else show(d.go, d.then === 'resume');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') drawer(false); const s = e.target.dataset && e.target.dataset.star; if (s && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); flashTopic(s); } });
  fab.onclick = () => $('#contents-' + cur).scrollIntoView({ behavior: 'smooth' });
  show(location.hash.slice(1));

  /* first visit: ask her to save the page */
  if (!store.get('saved')) {
    const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
    m.innerHTML = `<div class="box"><div class="seal">${ic('bookmark')}</div><span class="eyebrow">Before you begin</span><h2 class="h2">Save this page, ${CLIENT.name}</h2>
      <p class="lede">This is your private portal. Every reading, message and next step will live here as your journey unfolds, so keep it somewhere you can always find it.</p>
      <ul><li><b>iPhone:</b> tap Share, then Add to Home Screen</li><li><b>Android:</b> tap the ⋮ menu, then Add to Home screen</li><li><b>Computer:</b> press Ctrl+D (Cmd+D on Mac) to bookmark it</li></ul>
      <button class="btn" type="button" id="savedBtn">I've saved it ✦</button></div>`;
    document.body.appendChild(m); $('#savedBtn').onclick = () => { store.set('saved', '1'); m.remove(); };
  }

  /* keep readings in the portal: blocks select, copy, right-click, print. Her own writing stays copyable. */
  const toast = $('#toast'), MSG = 'Your readings stay here in your portal, so they are always waiting for you ✦'; let tt;
  const say = (m = MSG) => { toast.textContent = m; toast.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('on'), 2600); };
  const mine = e => e.target.closest && e.target.closest('textarea,input');
  ['copy', 'cut'].forEach(ev => document.addEventListener(ev, e => { if (mine(e)) return; e.preventDefault(); try { e.clipboardData.setData('text/plain', 'This reading lives in your private Connection Map from Luana Spirits. Open your portal to read it.'); } catch (_) {} say(); }));
  ['selectstart', 'dragstart'].forEach(ev => document.addEventListener(ev, e => { if (!mine(e)) e.preventDefault(); }));
  document.addEventListener('contextmenu', e => { if (!mine(e)) { e.preventDefault(); say(); } });
  document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && 'cxaspu'.includes(e.key.toLowerCase()) && !mine(e)) { e.preventDefault(); say(); } });
})();
</script>
</body>
</html>
