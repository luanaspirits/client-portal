<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>The Connection Map · Poonam</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('cm-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){document.documentElement.dataset.theme='light'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap">
<style>
/* ===== Tokens ===== */
:root{color-scheme:light;
  --bg:#f8f4fb;--bg2:#efe6f6;--card:#fff;--well:#faf6fd;--rule:#e6daf0;
  --ink:#2b1f38;--soft:#5f5070;--dim:#9a8bab;
  --plum:#5b3a7c;--plum2:#7c58a3;--lav:#c9b4e2;--lav2:#f2eaf9;
  --gold:#a8823e;--glow:#efd59d;--rose:#c4899b;
  --side:#46305f;--side2:#33224a;--star:#f7f0fc;--mist:#d2c4e2;
  --serif:'Playfair Display',Georgia,serif;--sans:'Jost','Helvetica Neue',Arial,sans-serif;--mono:'DM Mono',ui-monospace,Menlo,monospace;
  --sh:0 18px 40px -22px rgba(70,48,95,.35)}
html[data-theme=dark]{color-scheme:dark;
  --bg:#1a1322;--bg2:#241a30;--card:#231a2e;--well:#1e1628;--rule:#3a2d4b;
  --ink:#efe7f8;--soft:#c4b6d6;--dim:#8f80a4;
  --plum:#8c63bd;--plum2:#c7a6ef;--lav:#7d64a3;--lav2:#2d2140;--gold:#d9b46e;--rose:#d9a0b2;
  --sh:0 18px 40px -22px rgba(0,0,0,.7)}

/* ===== Base ===== */
[hidden]{display:none!important}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font:400 17px/1.7 var(--sans);color:var(--ink);background:var(--bg);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
textarea,input{-webkit-user-select:text;user-select:text}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--plum2);outline-offset:3px}
p{margin:0} h2,h3{margin:0;font-family:var(--serif);font-weight:400}
em{font-family:var(--serif);font-style:italic} strong,b{font-weight:500}
a{color:var(--plum2)} svg{display:block}
ul.dots{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ul.dots li{display:flex;gap:10px;line-height:1.6}
ul.dots li::before{content:"\2726";color:var(--gold);flex:0 0 auto}

/* ===== Shell ===== */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
@media(min-width:1000px){.app{grid-template-columns:300px minmax(0,1fr)}}
.side{position:fixed;inset:0 auto 0 0;z-index:30;width:min(320px,86vw);overflow-y:auto;overscroll-behavior:contain;color:var(--star);
  background:radial-gradient(ellipse at 20% 0%,#6a4a8c,transparent 60%),linear-gradient(180deg,var(--side),var(--side2));
  transform:translateX(-102%);transition:transform .35s cubic-bezier(.2,.7,.2,1);
  padding:calc(24px + env(safe-area-inset-top,0px)) 14px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;scrollbar-width:thin}
.side.open{transform:none;box-shadow:24px 0 60px rgba(30,15,45,.4)}
@media(min-width:1000px){.side{position:sticky;top:0;height:100vh;width:auto;transform:none}}
.side>*{position:relative;z-index:1}
.tw{position:absolute;z-index:0!important;border-radius:50%;background:#fff;animation:tw 5s infinite ease-in-out;pointer-events:none}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.8}}
.brand{display:flex;align-items:center;justify-content:space-between;padding:0 8px;font:500 10.5px var(--mono);letter-spacing:3px;text-transform:uppercase;color:var(--glow)}
.brand>span{display:flex;gap:10px;align-items:center}
.brand svg{width:18px;height:18px}
.icon-btn{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:none;cursor:pointer;color:var(--glow)}
.icon-btn svg{width:16px;height:16px}
@media(min-width:1000px){.side .close{display:none}}
.who{padding:0 8px}
.who b{display:block;font:400 32px/1.1 var(--serif);color:#fff}
.who span{font:10.5px var(--mono);letter-spacing:1.8px;text-transform:uppercase;color:var(--mist)}
.minimap{width:100%;text-align:left;cursor:pointer;border:1px solid rgba(239,213,157,.25);border-radius:18px;padding:12px 14px 14px;background:rgba(255,255,255,.06);display:flex;flex-direction:column;gap:8px;color:var(--mist)}
.minimap .row{display:flex;justify-content:space-between;font:10.5px var(--mono);letter-spacing:1.5px;text-transform:uppercase}
.minimap b{color:var(--glow);font-weight:500}
.grp{font:10px var(--mono);letter-spacing:2.6px;text-transform:uppercase;color:var(--glow);opacity:.85;padding:12px 10px 6px}
.mi{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;cursor:pointer;text-align:left;padding:7px 8px;border-radius:14px;color:var(--mist);transition:background .2s}
.mi:hover{background:rgba(255,255,255,.07);color:#fff}
.mi[aria-current]{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1px rgba(239,213,157,.35)}
.gl{flex:0 0 38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--lav);color:#efe6fa}
.gl svg{width:18px;height:18px}
.mi.hi .gl{border:0;background:radial-gradient(circle at 35% 30%,#f8e7c4,#c9a25e);color:var(--side2);box-shadow:0 0 18px rgba(239,213,157,.35)}
.mt{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.3}
.mt b{font-weight:400;font-size:15px;color:#fff}
.mt small{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font:9.5px var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--side2);background:var(--glow);border-radius:20px;padding:2px 8px;white-space:nowrap}
.side-foot{margin-top:auto;padding:16px 10px 0;border-top:1px solid rgba(255,255,255,.1);font-size:12.5px;line-height:1.55;color:var(--mist)}
.scrim{position:fixed;inset:0;background:rgba(43,31,56,.45);z-index:25;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.col{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--rule)}
@media(min-width:1000px){.top{display:none}}
.menu-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--card);border-radius:30px;padding:8px 14px 8px 12px;cursor:pointer;font-size:14px}
.menu-btn svg{width:17px;height:17px}
.top .t{font:18px var(--serif);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .icon-btn{border-color:var(--rule);color:var(--plum2)}
main{width:100%;max-width:900px;margin:0 auto;padding:32px 18px 80px}
@media(min-width:1000px){main{padding:52px 56px 100px}}
.view{display:flex;flex-direction:column;gap:36px;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}

/* ===== Type + buttons ===== */
.eyebrow{font:11px var(--mono);letter-spacing:3px;text-transform:uppercase;color:var(--plum2)}
.h2{font-size:clamp(28px,4.6vw,42px);line-height:1.14;text-wrap:balance}
.h2 em{color:var(--plum2)}
.h3{font-size:22px;line-height:1.3}
.head{display:flex;flex-direction:column;gap:12px}
.lede{color:var(--soft);max-width:62ch}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-block;font:11.5px var(--mono);letter-spacing:.8px;padding:5px 12px;border-radius:30px;background:var(--card);border:1px solid var(--rule);color:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:500;font-size:15px;color:#fff;background:var(--plum);border:0;border-radius:40px;padding:14px 24px;cursor:pointer;text-decoration:none;transition:transform .2s,filter .2s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn svg{width:16px;height:16px}
.btn.gold{background:linear-gradient(135deg,#d2ad68,#a07a37)}
.btn.ghost{background:var(--card);color:var(--plum2);box-shadow:inset 0 0 0 1px var(--rule)}
.btn.sm{padding:9px 16px;font-size:14px}
.link{background:none;border:0;padding:0;cursor:pointer;color:var(--plum2);font-size:15px;text-decoration:underline;text-underline-offset:3px}
.row-btns{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.until{font:11.5px var(--mono);letter-spacing:.8px;color:var(--dim)}
.box{background:var(--card);border:1px solid var(--rule);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:12px}
.box.key{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.box .k{font:10.5px var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--plum2)}
.say{margin:4px 0;padding:4px 0 4px 16px;border-left:2px solid var(--lav);font:italic 19px/1.5 var(--serif);color:var(--plum2)}
.say small{display:block;margin-top:4px;font:10.5px var(--mono);font-style:normal;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
.note{border-left:2px solid var(--lav);background:var(--lav2);padding:16px 20px;border-radius:0 14px 14px 0;font-size:15.5px;color:var(--soft)}
.stack{display:flex;flex-direction:column;gap:14px}
.step{display:flex;gap:12px;align-items:flex-start}
.step .num{flex:0 0 30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#a8823e,#7c58a3);color:#fff;display:grid;place-items:center;font:500 13px var(--mono)}

/* ===== Landing ===== */
.hero{position:relative;overflow:hidden;border-radius:28px;color:var(--star);min-height:340px;display:flex;align-items:flex-end;background:linear-gradient(135deg,#7a56a2,#55387a 55%,#432b62);box-shadow:0 40px 70px -40px rgba(70,48,95,.7)}
.hero .bg{position:absolute;inset:0}
.hero .bg svg{width:100%;height:100%}
.hero .in{position:relative;padding:clamp(26px,5vw,46px);display:flex;flex-direction:column;gap:16px;max-width:580px}
.hero .eyebrow{color:var(--glow)}
.quote{font:italic 400 clamp(25px,4.4vw,38px)/1.26 var(--serif);color:#fff;text-wrap:balance;animation:rise 1s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.qfrom{font-size:14px;color:var(--mist)}
.again{align-self:flex-start;display:inline-flex;gap:8px;align-items:center;border:1px solid rgba(239,213,157,.45);background:rgba(255,255,255,.08);color:var(--glow);border-radius:30px;padding:8px 14px;cursor:pointer;font:11px var(--mono);letter-spacing:1.4px;text-transform:uppercase}
.again svg{width:14px;height:14px}
.stats{display:flex;flex-wrap:wrap;gap:8px 24px;font:11px var(--mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--mist)}
.stats b{color:var(--glow);font-weight:500;font-size:13px}
.letter{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:24px;padding:30px 30px 26px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh)}
.letter::before{content:"";position:absolute;inset:0 0 auto;height:4px;border-radius:24px 24px 0 0;background:linear-gradient(90deg,var(--lav),var(--rose),var(--glow))}
.letter p{font:italic 400 20px/1.6 var(--serif)}
.letter .sig{font-size:24px;color:var(--plum2)}
.next{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding:28px;border-radius:24px;background:linear-gradient(135deg,var(--lav2),#fbf3ea);border:1px solid var(--rule)}
html[data-theme=dark] .next{background:linear-gradient(135deg,#2b2040,#2e2230)}
@media(min-width:700px){.next{grid-template-columns:minmax(0,1fr) auto;align-items:center}}
.next .door{font:italic 22px/1.45 var(--serif);margin-top:8px}
.next .fine{font-size:15px;color:var(--soft);margin-top:10px}
.next .act{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.skybox{border-radius:28px;padding:clamp(22px,4vw,34px);background:linear-gradient(160deg,#4f3570,#3a2655);color:var(--star);display:flex;flex-direction:column;gap:14px}
.skybox .eyebrow{color:var(--glow)} .skybox .h2{color:#fff} .skybox .h2 em{color:var(--glow)} .skybox .lede{color:var(--mist)}
.sky-wrap{overflow-x:auto;scrollbar-width:none}
.sky-wrap svg{min-width:560px;width:100%;height:auto}
.swipe{display:none;font:10.5px var(--mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--mist)}
@media(max-width:600px){.swipe{display:block}}
.cons .ln{stroke:var(--glow);opacity:.55}
.cons .st{cursor:pointer}
.cons .c{fill:var(--glow);stroke:var(--glow)}
.cons .h{fill:var(--glow);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.1}50%{opacity:.28}}
.cons .lb{font:10px var(--mono);letter-spacing:1px;text-transform:uppercase;fill:var(--glow)}
.picture{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px}
.pc{text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--rule);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;transition:transform .2s,box-shadow .2s}
.pc:hover,.topic:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--lav2);color:var(--plum2)}
.ico svg{width:19px;height:19px}
.pc .t{font:10.5px var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.pc .v{font:26px/1.1 var(--serif)}
.pc .d{font-size:14.5px;color:var(--soft);line-height:1.5}
.rung-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 14px;border-bottom:1px solid var(--rule);padding-bottom:10px}
.rung-head b{font:400 22px var(--serif)}
.rung-head span{font:11px var(--mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--plum2)}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
.topic{text-align:left;cursor:pointer;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--rule);background:var(--card);transition:all .2s}
.topic .k{display:flex;gap:8px;align-items:center;font:10.5px var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--plum2)}
.topic .k svg{width:13px;height:13px}
.topic .v{font:19px/1.3 var(--serif)}
.topic .d{font-size:14.5px;color:var(--soft);line-height:1.5}
.flash{box-shadow:0 0 0 2px var(--plum2)!important}

/* ===== Sessions ===== */
.sess-hero{position:relative;border-radius:24px;overflow:hidden;min-height:160px;display:flex;align-items:flex-end;background:linear-gradient(150deg,#6a4790,#432b62);color:#fff}
.sess-hero .in{position:relative;padding:clamp(22px,4vw,34px);display:flex;flex-direction:column;gap:8px}
.sess-hero .eyebrow{color:var(--glow)} .sess-hero .h2{color:#fff} .sess-hero p{color:var(--mist);max-width:56ch}
.sess-hero .bg{position:absolute;inset:0;opacity:.9}
.sess-hero .bg svg{width:100%;height:100%}
.log{display:flex;flex-direction:column}
.log button{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 2px;cursor:pointer}
.log button:first-child{border:0}
.log .d{font:11.5px var(--mono);letter-spacing:1px;color:var(--plum2)}
.log b{display:block;font:400 18px/1.3 var(--serif)}
.log small{color:var(--soft);font-size:14px}
.log svg{width:16px;height:16px;color:var(--dim)}
.pager{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;padding-top:24px;border-top:1px solid var(--rule)}

/* ===== Plan, practices, journal ===== */
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;line-height:1.55}
.check input{accent-color:var(--gold);width:19px;height:19px;margin-top:4px;flex:0 0 auto}
.check input:checked+span{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--lav)}
.goal{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.goal:first-of-type{border:0}
@media(max-width:560px){.goal{grid-template-columns:minmax(0,1fr)}}
label.q{font:italic 18px/1.4 var(--serif);color:var(--ink)}
textarea,input[type=text]{width:100%;border-radius:14px;border:1px solid var(--rule);background:var(--well);color:var(--ink);font-size:16px;padding:12px 14px;line-height:1.6}
textarea{min-height:110px;resize:vertical}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--lav);background:var(--card)}
.saved{font:10.5px var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:var(--dim)}

/* ===== Academy ===== */
.mod ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mod li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--rule)}
.mod li:first-child{border:0}
.ck{flex:0 0 22px;height:22px;border-radius:50%;border:1px solid var(--lav);display:grid;place-items:center;color:var(--dim);background:none;padding:0;cursor:pointer}
.ck svg{width:11px;height:11px;opacity:0}
.ck.done{background:var(--plum2);border-color:var(--plum2);color:#fff}
.ck.done svg{opacity:1}
.mod li b{display:block;font-weight:500;font-size:15.5px}
.mod li span{font-size:14px;color:var(--soft);line-height:1.5}
.reward{display:grid;gap:18px;padding:28px;border-radius:26px;color:var(--star);background:radial-gradient(ellipse at 90% 0%,rgba(239,213,157,.3),transparent 60%),linear-gradient(160deg,#5b3a7c,#3a2655)}
@media(min-width:760px){.reward{grid-template-columns:100px minmax(0,1fr);align-items:center}}
.seal{width:92px;height:92px;border-radius:50%;border:1.5px solid var(--glow);display:grid;place-items:center;color:var(--glow);box-shadow:0 0 40px rgba(239,213,157,.3)}
.seal svg{width:36px;height:36px}
.reward .eyebrow{color:var(--glow)} .reward .h3{color:#fff} .reward p,.reward ol{color:var(--mist)}

/* ===== Questions ===== */
.ask{display:flex;flex-direction:column;gap:12px;padding:28px;border-radius:24px;background:linear-gradient(135deg,var(--lav2),#fbf3ea);border:1px solid var(--rule)}
html[data-theme=dark] .ask{background:linear-gradient(135deg,#2b2040,#2e2230)}
.ask .h2{font-size:clamp(26px,4vw,34px)}
.addrow{display:flex;flex-wrap:wrap;gap:10px}
.addrow input{flex:1 1 260px}
.held{display:flex;flex-direction:column;gap:10px}
.held .q{font:italic 19px/1.4 var(--serif)}

/* ===== Footer, toast, modal ===== */
footer{border-top:1px solid var(--rule);text-align:center;padding:40px 20px 80px;color:var(--dim);font-size:14px;display:flex;flex-direction:column;gap:8px;align-items:center}
footer b{font:400 26px var(--serif);color:var(--plum2)}
footer small{max-width:60ch}
footer nav{display:flex;gap:16px}
footer a{color:var(--soft)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--plum);color:#fff;padding:12px 20px;border-radius:30px;font-size:14px;z-index:50;transition:all .3s;pointer-events:none;width:max-content;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:18px;background:rgba(43,31,56,.55);backdrop-filter:blur(4px)}
.modal .box{max-width:460px;width:100%;gap:14px;padding:30px;box-shadow:0 40px 80px -30px rgba(30,15,45,.6);animation:rise .5s ease}
.modal .seal{width:64px;height:64px;color:var(--plum2);border-color:var(--lav);box-shadow:none}
.modal .seal svg{width:26px;height:26px}
.modal ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--soft)}
@media print{body *{display:none!important}body::after{content:"This portal is private. Please open it online.";display:block;padding:60px;font:18px Georgia,serif}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

        ${cb('ep-rec', 'Record Episode 1, between Thu Oct 29 and Sun Nov 1')}
        ${cb('ep-edit', 'Edit it, myself or with the videographer')}
        ${cb('ep-pub', 'Publish it next week')}
        ${cb('ep-share', 'Share it on Instagram and TikTok, with stories and behind the scenes')}
        ${cb('ep-send', 'Send Luana the link')}</div></div>
      <div class="box"><span class="k">Your rhythm</span><div class="stack">
        ${cb('r-days', 'Pick my business days and my art days')}
        ${cb('r-block', 'Choose my weekly creative block (day and time)')}
        ${cb('r-med', 'Meditate 15 to 30 minutes today')}
        ${cb('r-20', 'Name the 20% that actually moves me toward my North Star')}
        ${cb('r-out', 'List the business tasks I could hand off')}
        ${cb('r-reiki', 'Look up an in-person Level 1 Reiki class (only if it feels fun)')}</div></div>
      <div class="box"><span class="k">Off your plate for now</span><ul class="dots">
        <li>A strict hour-by-hour daily schedule</li><li>The perfect podcast setup</li><li>Starting acting, singing, dance and the podcast all at once</li></ul></div>
      <div class="box"><span class="k">Your July goals, honestly</span><p>Where is each one now, and what got in the way? No shame, just honest. Your notes save on this device.</p>
        ${goals.map(([k, g]) => `<div class="goal"><b>${g}</b><input type="text" data-key="goal-${k}" maxlength="160" placeholder="Where it is, what got in the way"></div>`).join('')}</div>`,

    tools: () => `<div class="head"><span class="eyebrow">Practices</span><h2 class="h2">Tools for <em>coming home</em></h2>
        <p class="lede">Small things you can do on any day, especially the hard ones.</p></div>
      <div class="box"><span class="k">Your anchors</span>
        <p class="say">“You are enough and loved just the way you are. Source put you on this earth to uplift humanity by being your own source.”<small>Aug 27</small></p>
        <p class="say">“Even if misunderstood, I love myself regardless.”<small>Oct 27 · for the part that fears being misunderstood</small></p></div>
      <div class="box"><span class="k">A simple meditation rhythm</span><div class="stack">
        <div class="step"><span class="num">1</span><div><b>Journal for 10 to 15 minutes.</b> Get the thoughts out of your head and onto paper.</div></div>
        <div class="step"><span class="num">2</span><div><b>Scan your body and chakras.</b> Notice heaviness, coldness or frustration. Your throat and heart have been asking for attention.</div></div>
        <div class="step"><span class="num">3</span><div><b>Visualize light moving through.</b> Wherever your attention goes, energy moves.</div></div>
        <div class="step"><span class="num">4</span><div><b>Close with an intention</b> to clear your energy. On dysregulated days, put on a guided meditation instead.</div></div></div></div>
      <div class="box"><span class="k">A short tapping round for your throat</span><p>For anxiety, tightness in the throat, or the fear of being misunderstood. Tap each point while you speak.</p><div class="stack">
        <div class="step"><span class="num">1</span><div><b>Side of hand, three times:</b> <em>“Even though I feel this tightness and I’m afraid of being misunderstood, I love and accept myself.”</em></div></div>
        <div class="step"><span class="num">2</span><div><b>Eyebrow and side of eye:</b> <em>“This old habit of going quiet to stay safe.”</em></div></div>
        <div class="step"><span class="num">3</span><div><b>Under nose and chin:</b> <em>“I give my voice permission to make noise.”</em></div></div>
        <div class="step"><span class="num">4</span><div><b>Collarbone and top of head:</b> <em>“Even if misunderstood, I love myself regardless.”</em></div></div></div></div>
      <div class="box"><span class="k">Inner child check-in</span><p>When the little girl inside feels unchosen or anxious, sit with her for a few minutes and ask:</p>
        <ul class="dots"><li>What are you afraid will happen?</li><li>Where do you feel it in our body?</li><li>What do you need from me right now?</li></ul>
        <p>Then tell her what she needed to hear back then. You already know how. You did it before our last session, and you said it helped.</p></div>`,

    journal: () => `<div class="head"><span class="eyebrow">Integration journal</span><h2 class="h2">Your <em>reflection space</em></h2>
        <p class="lede">Your entries save on this device only. Download a copy any time to keep them safe.</p></div>
      <div class="box">
        <label class="q" for="j1">Where did I let myself speak my truth today, without needing approval?</label><textarea id="j1" data-key="j1"></textarea>
        <label class="q" for="j2">Where did I catch myself rushing, and how did I slow down?</label><textarea id="j2" data-key="j2"></textarea>
        <label class="q" for="j3">How did I care for the part of me that feels unchosen?</label><textarea id="j3" data-key="j3"></textarea>
        <label class="q" for="j4">Anything else I want to remember</label><textarea id="j4" data-key="j4"></textarea>
        <div class="row-btns"><button class="btn ghost sm" type="button" id="dl">${ic('download')}Download my journal</button><span class="saved" id="savedNote"></span></div></div>`,

    academy: () => { const done = (store.get('course') || '').split(','); let n = 0;
      return `<div class="head"><span class="eyebrow">Spiritual Love Healing Academy</span><h2 class="h2">Manifest Your Union, <em>lesson by lesson</em></h2>
        <p class="lede">Move at your own pace. One lesson and one integration activity a week is plenty. Tick each lesson when you finish it and its workbook page.</p>
        <div class="row-btns"><a class="btn" href="${CLIENT.academy.url}" target="_blank" rel="noopener">Open the Academy${ic('arrow')}</a></div></div>
      <div class="stack">${COURSE.map(([m, ls], mi) => `<div class="box mod"><span class="k">Module ${mi + 1}</span><h3 class="h3">${m}</h3><ol>${ls.map(([t, d]) => { const k = 'L' + n++;
        return `<li><button class="ck ${done.includes(k) ? 'done' : ''}" type="button" data-lesson="${k}" aria-pressed="${done.includes(k)}" aria-label="Mark ${esc(t)} complete">${ic('check')}</button><div><b>${t}</b><span>${d}</span></div></li>`; }).join('')}</ol></div>`).join('')}</div>
      <div class="reward"><div class="seal">${ic('spark')}</div><div class="head"><span class="eyebrow">The course reward</span><h3 class="h3">Finish the work, receive a reading</h3>
        <p>When you complete every lesson, email me your finished workbook pages and I’ll send you a complimentary reading as a thank you.</p>
        <ol style="margin:0;padding-left:20px"><li>Complete all lessons and every workbook page</li><li>Email your pages to ${CLIENT.email} with the subject “Manifest Your Union complete”</li><li>I’ll review them and send your reading booking link</li></ol></div></div>`; },

    questions: () => `<section class="ask"><span class="eyebrow">What are you still holding?</span><h2 class="h2">Write it down. <em>Bring it to me when you’re ready.</em></h2>
        <p class="lede">Your questions stay here on this device until you send them.</p>
        <div class="addrow"><input type="text" id="newq" maxlength="300" placeholder="A question for Luana…" aria-label="Your question"><button class="btn" type="button" id="addq">Hold this question</button></div></section>
      <div class="held" id="held"></div>`
  };
  SESSIONS.forEach((s, i) => { V[s.id] = () => session(s, i); });

  /* ---------- navigation ---------- */
  const NAV = [
    ['', [['map', 'Your map', 'map', 'Everything in one place']]],
    ['Coaching', [
      ...SESSIONS.map((s, i) => [s.id, `${s.short} · ${s.title}`, i ? 'chat' : 'spark', s.sub, i ? '' : 'Latest']),
      ['calls', 'All sessions', 'play', SESSIONS.length + ' sessions'],
      ['plan', 'Your plan', 'pen', 'Episode 1 and your rhythm'],
      ['tools', 'Practices', 'heart', 'Anchors, meditation, tapping'],
      ['journal', 'Journal', 'book', 'Your reflection space']]],
    ['Academy', [['academy', 'Manifest Your Union', 'gem', 'Course and reward']]],
    ['You', [['questions', 'Your questions', 'mail', 'Send them to Luana']]]
  ];
  const side = $('#side'), pages = $('#pages'), LABEL = {};
  let nav = '';
  NAV.forEach(([g, items]) => {
    if (g) nav += `<div class="grp">${g}</div>`;
    items.forEach(([id, label, icon, sub, tag]) => {
      LABEL[id] = label;
      nav += `<button type="button" class="mi${tag ? ' hi' : ''}" data-go="${id}"><span class="gl">${ic(icon)}</span><span class="mt"><b>${label}</b><small>${sub}</small></span>${tag ? `<span class="tag">${tag}</span>` : ''}</button>`;
      pages.insertAdjacentHTML('beforeend', `<section class="view" id="v-${id}" hidden>${V[id]()}</section>`);
    });
  });
  side.innerHTML = `<div class="brand"><span>${ic('spark')}Luana Spirits</span><span style="display:flex;gap:8px"><button class="icon-btn" type="button" data-theme-toggle aria-label="Switch light or dark mode"></button><button class="icon-btn close" id="closeMenu" type="button" aria-label="Close menu">${ic('close')}</button></span></div>
    <div class="who"><b>${CLIENT.name}</b><span>${CLIENT.since}</span></div>
    <button class="minimap" type="button" data-go="map" aria-label="Open your constellation"><svg class="cons" id="miniSky" viewBox="0 0 660 340" aria-hidden="true"></svg><div class="row"><span><b>${TOPICS.length}</b> stars lit</span><span>Your map</span></div></button>
    <nav>${nav}</nav><div class="side-foot">Your private space with Luana. Everything we’ve worked on lives here, and it grows as you do.</div>`;
  for (let i = 0; i < 40; i++) { const s = document.createElement('span'), z = Math.random() * 1.8 + .5; s.className = 'tw'; s.style.cssText = `width:${z}px;height:${z}px;left:${Math.random() * 100}%;top:${Math.random() * 100}%;animation-delay:${Math.random() * 5}s`; side.appendChild(s); }
  $('#openMenu').innerHTML = ic('menu') + 'Menu';

  /* ---------- constellation ---------- */
  const NS = 'http://www.w3.org/2000/svg';
  const el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt) e.textContent = txt; return e; };
  function drawSky(svg, full) {
    if (!svg) return; const s = full ? 1 : 0.75;
    TOPICS.slice(1).forEach((b, i) => { const a = TOPICS[i]; svg.appendChild(el('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: 'ln', 'stroke-width': s })); });
    TOPICS.forEach((t, i) => {
      const g = el('g', { class: 'st' }), { x, y } = t, d = 9 * s, e = 2.4 * s;
      g.appendChild(el('circle', { cx: x, cy: y, r: 16 * s, class: 'h' }));
      g.appendChild(el('path', { class: 'c', d: `M${x} ${y - d}L${x + e} ${y - e}L${x + d} ${y}L${x + e} ${y + e}L${x} ${y + d}L${x - e} ${y + e}L${x - d} ${y}L${x - e} ${y - e}Z` }));
      if (full) {
        g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button'); g.setAttribute('aria-label', t.name); g.dataset.star = t.id;
        g.appendChild(el('text', { x, y: i % 2 ? y - 20 : y + 28, 'text-anchor': 'middle', class: 'lb' }, t.name));
      }
      svg.appendChild(g);
    });
  }
  drawSky($('#sky'), true); drawSky($('#miniSky'), false);

  /* ---------- saved fields ---------- */
  document.querySelectorAll('[data-key]').forEach(t => { t.value = store.get(t.dataset.key);
    t.addEventListener('input', () => { store.set(t.dataset.key, t.value); const n = $('#savedNote'); if (n && t.tagName === 'TEXTAREA') n.textContent = 'Saved on this device'; }); });
  document.querySelectorAll('[data-check]').forEach(c => { c.checked = store.get('ck-' + c.dataset.check) === '1';
    c.addEventListener('change', () => store.set('ck-' + c.dataset.check, c.checked ? '1' : '')); });
  $('#dl').onclick = () => {
    const txt = [...document.querySelectorAll('#v-journal label.q')].map(l => `${l.textContent}\n${store.get(l.htmlFor) || '(empty)'}\n`).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([`My journal · ${new Date().toLocaleDateString()}\n\n${txt}`], { type: 'text/plain' }));
    a.download = `${CLIENT.key}-journal.txt`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  /* ---------- theme ---------- */
  function setTheme(th) {
    document.documentElement.dataset.theme = th; try { localStorage.setItem('cm-theme', th); } catch (e) {}
    document.querySelectorAll('[data-theme-toggle]').forEach(b => { b.innerHTML = ic(th === 'dark' ? 'sun' : 'moon'); b.title = th === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'; });
  }
  setTheme(document.documentElement.dataset.theme || 'light');

  /* ---------- daily message ---------- */
  $('#again').onclick = () => {
    const k = (parseInt(store.get('msg-' + day)) || 0) + 1; store.set('msg-' + day, k); msgI = (day + k) % CLIENT.messages.length;
    const q = $('#quote'); q.style.animation = 'none'; void q.offsetHeight; q.style.animation = '';
    q.textContent = CLIENT.messages[msgI][0]; $('#qfrom').textContent = 'Another message for you · from ' + CLIENT.messages[msgI][1];
  };

  /* ---------- questions ---------- */
  const qList = () => { try { return JSON.parse(store.get('qs') || '[]'); } catch (e) { return []; } };
  const askMail = q => mail(`A question from ${CLIENT.name}`, `Hi Luana,\n\nSomething I'm holding:\n\n"${q}"\n\n${CLIENT.name}`);
  const renderHeld = () => { const qs = qList();
    $('#held').innerHTML = qs.length ? qs.map((q, i) => `<div class="box"><p class="q">“${esc(q)}”</p><div class="row-btns"><a class="btn sm" href="${askMail(q)}">${ic('mail')}Send this to Luana</a><button class="link" type="button" data-delq="${i}">Remove</button></div></div>`).join('')
      : '<p class="lede">Your questions will appear here.</p>'; };
  const saveQs = qs => { store.set('qs', JSON.stringify(qs)); renderHeld(); };
  $('#addq').onclick = () => { const v = $('#newq').value.trim(); if (!v) return; saveQs(qList().concat(v)); $('#newq').value = ''; };
  $('#newq').onkeydown = e => { if (e.key === 'Enter') $('#addq').click(); };
  renderHeld();

  /* ---------- drawer + routing ---------- */
  const scrim = $('#scrim');
  const drawer = on => { side.classList.toggle('open', on); scrim.classList.toggle('on', on); $('#openMenu').setAttribute('aria-expanded', on); };
  $('#openMenu').onclick = () => drawer(true); $('#closeMenu').onclick = scrim.onclick = () => drawer(false);
  function show(id) {
    if (!LABEL[id]) id = 'map';
    document.querySelectorAll('.view').forEach(v => v.hidden = v.id !== 'v-' + id);
    side.querySelectorAll('.mi').forEach(b => b.dataset.go === id ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
    $('#tbTitle').textContent = LABEL[id]; drawer(false);
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
    scrollTo(0, 0);
  }
  const flashTopic = id => { const c = $('#topic-' + id); if (!c) return; c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.classList.add('flash'); setTimeout(() => c.classList.remove('flash'), 1500); };
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-go],[data-star],[data-delq],[data-lesson],[data-theme-toggle]'); if (!t) return;
    const d = t.dataset;
    if ('themeToggle' in d) setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    else if (d.star) flashTopic(d.star);
    else if (d.delq) { const qs = qList(); qs.splice(+d.delq, 1); saveQs(qs); }
    else if (d.lesson) { const done = new Set((store.get('course') || '').split(',').filter(Boolean));
      done.has(d.lesson) ? done.delete(d.lesson) : done.add(d.lesson); t.classList.toggle('done'); t.setAttribute('aria-pressed', done.has(d.lesson)); store.set('course', [...done].join(',')); }
    else show(d.go);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') drawer(false);
    const s = e.target.dataset && e.target.dataset.star; if (s && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); flashTopic(s); } });
  show(location.hash.slice(1));

  /* ---------- first visit: save this page ---------- */
  if (!store.get('saved')) {
    const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-labelledby', 'saveTitle');
    m.innerHTML = `<div class="box"><div class="seal">${ic('bookmark')}</div><span class="eyebrow">Before you begin</span><h2 class="h2" id="saveTitle">Save this page, ${CLIENT.name}</h2>
      <p class="lede">This is your private portal. Every session, practice and next step lives here, so keep it somewhere you can always find it.</p>
      <ul><li><b>iPhone:</b> tap Share, then Add to Home Screen</li><li><b>Android:</b> tap the ⋮ menu, then Add to Home screen</li><li><b>Computer:</b> press Ctrl+D (Cmd+D on Mac) to bookmark it</li></ul>
      <button class="btn" type="button" id="savedBtn">I’ve saved it ✦</button></div>`;
    document.body.appendChild(m); $('#savedBtn').focus(); $('#savedBtn').onclick = () => { store.set('saved', '1'); m.remove(); };
  }

  /* ---------- keep the work in the portal: blocks select, copy, right-click, print. Her own writing stays copyable. ---------- */
  const toast = $('#toast'), MSG = 'Your sessions stay here in your portal, so they’re always waiting for you ✦'; let tt;
  const say = (m = MSG) => { toast.textContent = m; toast.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('on'), 2600); };
  const mine = e => e.target.closest && e.target.closest('textarea,input');
  ['copy', 'cut'].forEach(ev => document.addEventListener(ev, e => { if (mine(e)) return; e.preventDefault(); try { e.clipboardData.setData('text/plain', 'This lives in your private Connection Map from Luana Spirits.'); } catch (_) {} say(); }));
  ['selectstart', 'dragstart'].forEach(ev => document.addEventListener(ev, e => { if (!mine(e)) e.preventDefault(); }));
  document.addEventListener('contextmenu', e => { if (!mine(e)) { e.preventDefault(); say(); } });
  document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && 'cxaspu'.includes(e.key.toLowerCase()) && !mine(e)) { e.preventDefault(); say(); } });
})();
</script>
</body>
</html>
