<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Amy's private Lion's Gate Union Activation dashboard, built from her 6-month reading.">
<title>Amy's Union Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #2a1640; --card: rgba(255,255,255,0.07); --text: #f5eefb; --muted: #c2aed8; --muted-2: #9880b8;
    --gold: #c9a548; --gold-soft: #e8d5a0; --violet: #a988e8; --periwinkle: #8ca8e8;
    /* OPTIONAL: --accent2 can shift to match a dominant chakra/card/season for this client,
       e.g. --accent2: #c4544a for root chakra red. Leave as violet if no strong theme fits. */
    --line: rgba(255,255,255,0.14); --line-strong: rgba(255,255,255,0.26);
  }
  body {
    background: radial-gradient(ellipse at 15% 0%, #4a2c6e60 0%, transparent 55%),
                radial-gradient(ellipse at 88% 10%, #8ca8e830 0%, transparent 48%),
                radial-gradient(ellipse at 50% 105%, #c9a54830 0%, transparent 55%), var(--bg);
    color: var(--text); font-family: 'Jost', sans-serif; font-weight: 300; min-height: 100vh; position: relative;
  }
  #sparkles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .spark { position: absolute; border-radius: 50%; background: radial-gradient(circle, #fff, var(--violet) 70%, transparent 100%); animation: twinkle 4.5s ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:.15;transform:scale(.7);} 50%{opacity:.8;transform:scale(1.25);} }
  #app { position: relative; z-index: 2; max-width: 660px; margin: 0 auto; padding: 0 20px 60px; }
  h1, h2, h3 { font-family: 'Playfair Display', serif; color: var(--text); margin-bottom: 12px; }
  h1 { font-weight: 700; font-size: 27px; line-height: 1.3; }
  h2 { font-weight: 600; font-size: 21px; }
  h3 { font-weight: 600; font-size: 16px; }
  p { line-height: 1.75; color: var(--muted); font-size: 14.5px; margin-bottom: 14px; }
  em.hl { font-style: italic; color: var(--gold-soft); }
  .tagline { font-family: 'Playfair Display', serif; font-style: italic; color: var(--gold-soft); font-size: 16.5px; text-align: center; margin: 16px 0; }
  .center { text-align: center; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; margin-bottom: 16px; }
  .card.ritual { background: linear-gradient(150deg, rgba(201,165,72,0.12), rgba(155,127,212,0.08)); border-color: var(--line-strong); }
  .btn { display: inline-flex; align-items: center; gap: 8px; font-family: 'Jost', sans-serif; font-weight: 700; font-size: 14px; padding: 13px 26px; border-radius: 999px; border: none; cursor: pointer; text-decoration: none; }
  .btn.gold { background: linear-gradient(135deg, var(--gold-soft), var(--violet)); color: #2a1640; box-shadow: 0 6px 20px rgba(201,165,72,0.3); }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line-strong); }
  .btn.small { padding: 8px 16px; font-size: 12px; }
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
  textarea { width: 100%; background: rgba(0,0,0,0.18); border: 1px solid var(--line); border-radius: 12px; color: var(--text); font-family: 'Jost', sans-serif; font-size: 14.5px; padding: 13px; resize: vertical; min-height: 72px; margin-bottom: 14px; }
  .journal-q { font-size: 13.5px; color: var(--text); margin-bottom: 6px; font-weight: 500; }
  .topbar-left { display: flex; align-items: center; gap: 12px; justify-content: center; margin: 36px 0 10px; }
  .topbar-icon { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--gold-soft), var(--violet)); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .topbar-title { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 17px; }

  .topnav-wrap { position: sticky; top: 0; z-index: 10; padding: 16px 0 12px; }
  .topnav-brand-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 14px; }
  .topnav-brand-row .icon { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, var(--gold-soft), var(--violet)); display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
  .topnav-brand-row .name { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 13px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; justify-content: center; flex-wrap: wrap; }
  .tab { flex-shrink: 0; font-family: 'Jost', sans-serif; font-weight: 600; font-size: 12px; background: var(--card); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 9px 15px; cursor: pointer; }
  .tab.active { background: linear-gradient(135deg, var(--gold-soft), var(--violet)); color: #2a1640; border-color: transparent; font-weight: 700; }

  .step-progress { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 1px; color: var(--muted-2); text-align: center; margin-bottom: 8px; }
  .step-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 18px; }
  .step-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
  .step-dot.active { background: var(--gold); width: 20px; border-radius: 4px; }

  .quote-card { background: linear-gradient(150deg, rgba(155,127,212,0.14), rgba(140,168,232,0.10)); border: 1px solid var(--line-strong); border-radius: 18px; padding: 22px; margin-bottom: 14px; }
  .quote-card .label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
  .quote-card .quote { font-family: 'Playfair Display', serif; font-style: italic; font-size: 17px; color: var(--gold-soft); line-height: 1.5; margin-bottom: 10px; }
  .quote-card .meta { font-family: 'DM Mono', monospace; font-size: 10.5px; color: var(--muted-2); }

  .breathe-wrap { display: flex; flex-direction: column; align-items: center; padding: 12px 0 4px; }
  .breathe-ball { width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, var(--violet) 55%, #6b4fa0 100%); box-shadow: 0 0 40px rgba(169,136,232,0.4); transition: transform 4s ease-in-out; margin-bottom: 16px; }
  .breathe-label { font-family: 'Playfair Display', serif; font-size: 16px; min-height: 22px; text-align: center; color: var(--gold-soft); }

  .day-pills { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .day-pill { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--card); border: 1.5px solid var(--line); cursor: pointer; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }
  .day-pill.active { background: linear-gradient(135deg, var(--gold-soft), var(--violet)); color: #2a1640; border-color: transparent; font-weight: 700; }
  .day-pill.done { border-color: var(--gold); }

  .day-badge { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.5px; color: var(--gold); margin-bottom: 6px; }
  .practice-box { background: rgba(0,0,0,0.15); border-left: 3px solid var(--violet); border-radius: 0 12px 12px 0; padding: 14px 18px; margin: 14px 0; }
  .practice-box .lbl { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--gold-soft); margin-bottom: 4px; }

  .section-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); margin: 20px 0 8px; }

  .site-footer { margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--line); text-align: center; }
  .site-footer .brand { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .site-footer .brand em { font-style: italic; color: var(--gold-soft); }
  .site-footer .links { font-family: 'DM Mono', monospace; font-size: 10.5px; color: var(--muted-2); line-height: 1.9; }
  .site-footer a { color: var(--muted-2); text-decoration: none; }
</style>
</head>
<body>
<div id="sparkles"></div>
<div id="app"></div>

<script>
(function initSparkles() {
  const wrap = document.getElementById("sparkles");
  for (let i = 0; i < 16; i++) {
    const s = document.createElement("div");
    s.className = "spark";
    const size = 2 + Math.random() * 4;
    s.style.width = size + "px"; s.style.height = size + "px";
    s.style.left = Math.random() * 100 + "%"; s.style.top = Math.random() * 100 + "%";
    s.style.animationDelay = (Math.random() * 4.5) + "s";
    wrap.appendChild(s);
  }
})();

/* =========================================================================
   DATA, REPLACE EVERYTHING IN THIS SECTION WITH THIS CLIENT'S REAL READING
   CONTENT. Do not invent details, pull directly from the reading transcript
   or coaching call history. If content isn't available, leave a clear
   [MISSING: ...] flag instead of guessing.
   ========================================================================= */

// The core pattern/theme named in plain language, quoting the reading directly.
const PATTERN_TITLE = "From Overgiver To Abundant Receiver";
const PATTERN_INTRO = [
  "What you've built with TSL over seven years is real. What's also real is that he's currently in a survival state that has nothing to do with your worth and everything to do with what he's carrying.",
  "Your work through this season is the airplane oxygen mask principle, you cannot keep pouring from an empty place. You don't need to fix his healing or wait for his timeline, you simply need to keep choosing yourself."
];
const PATTERN_TAGLINE = "Self-love keeps you on your highest union timeline, even when your mind can't see how it plays out.";

// The Interrupt Tool, a guided multi-step practice for this client's specific trigger.
// 4-6 steps is typical. Each step needs a title and a prompt tied to the reading.
const INTERRUPT_STEPS = [
  { title: "Notice What's Happening", prompt: "What am I feeling right now, without judging it?" },
  { title: "Give Yourself Self-Love First", prompt: "Before I try to understand him or fix anything between us, can I offer myself the same compassion I offer him?" },
  { title: "Is This About My Worth, Or His Capacity?", prompt: "This isn't a reflection of my worth or lovability. It's a reflection of where he currently is." },
  { title: "Am I Pouring From Empty?", prompt: "The oxygen mask principle: am I giving from depletion right now? What would tending to myself first look like?" },
  { title: "Return To What's True", prompt: "Self-oriented love keeps me on my highest union timeline, even when my mind can't yet see how it plays out." }
];

// Direct quotes pulled from the reading. If multiple people are involved
// (children, a twin flame, family), give each their own card.
const QUOTE_CARDS = [
  { label: "On Your Worth", quote: "It is not a reflection of your worth or your lovability.", meta: "Karmic Cord Clearing" },
  { label: "On Self-Love", quote: "Self-oriented love keeps you on your highest union timeline even if your physical mind doesn't know how it will play out.", meta: "Karmic Cord Clearing" },
  { label: "On Not Waiting", quote: "You don't need to wait for him, and you don't need to hold his hand through this transition.", meta: "Karmic Cord Clearing" },
  { label: "On What You've Given Him", quote: "You are a disruptor to his old karmic patterns. This energy you're offering him is real. You are not delusional.", meta: "Quarter Two" },
  { label: "On Boundaries", quote: "Any balanced union also needs give and take. If he is not fully in a giving energy, it can easily deplete you.", meta: "Karmic Cord Clearing" },
  { label: "On His Gratitude", quote: "Thank you for being so patient with me, even when I don't deserve it.", meta: "His higher self, Quarter Two" }
];

// A grounding/connection ritual specific to this client, ideally something
// already suggested in the reading or a coaching call, not generic.
const PRACTICE_TITLE = "Your Daily Self-Love Practice";
const PRACTICE_BODY = "Before you tend to anyone else's needs today, ask yourself: where am I giving from depletion instead of abundance? Place a hand on your heart and offer yourself one thing you'd normally offer him, patience, compassion, or care. Self-love is the same frequency as the love you're meant to receive.";

// Journal prompts, 2-4 rotating themes tied specifically to this reading.
const JOURNAL_PROMPTS = [
  "Where did I give from depletion today, and where did I give from abundance?",
  "What's one way I offered myself the compassion I so easily offer others?",
  "What did I choose for myself today, independent of TSL's timeline?"
];
const TOTAL_DAYS = 184; // six months, Aug 6 2026 to Feb 6 2027

/* =========================================================================
   END OF CLIENT-SPECIFIC DATA. Everything below this line is reusable
   scaffolding, only touch it if the dashboard needs a structural change,
   not just new content.
   ========================================================================= */

let state = {
  activeTab: "pattern",
  interruptStep: 0, interruptAnswers: {}, savedInterrupts: [],
  breathing: false,
  activeDay: 1, dayJournal: {},
  cardPullLog: {}
};

const STORAGE_KEY = "amy-lions-gate-6month-dashboard-v1";
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
function loadState() { try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) state = { ...state, ...JSON.parse(raw) }; } catch (e) {} }
function go(patch) { state = { ...state, ...patch }; render(); }

function topNav() {
  const tabs = [
    { id: "pattern", label: "Your Pattern" },
    { id: "interrupt", label: "Interrupt Tool" },
    { id: "quotes", label: "Your Messages" },
    { id: "practice", label: "Daily Practice" },
    { id: "journal", label: "Journal" }
  ];
  return `<div class="topnav-wrap">
    <div class="topnav-brand-row"><div class="icon">\u{1F981}</div><div class="name">Amy's Union Journey</div></div>
    <div class="tabs">${tabs.map(t => `<div class="tab ${state.activeTab === t.id ? "active" : ""}" onclick="go({activeTab:'${t.id}'})">${t.label}</div>`).join("")}</div>
  </div>`;
}

function footer() {
  return `<div class="site-footer">
    <div class="brand">Luana <em>Spirits</em></div>
    <div class="links">
      <a href="mailto:luana@luanaspirits.com">luana@luanaspirits.com</a> &middot;
      <a href="https://docs.google.com/document/d/12oUQEXXesDmVw_XEZH-GEc8NVbtFYyLYf3359hvxyFE/edit?usp=sharing" target="_blank" rel="noopener">Privacy Policy</a> &middot;
      <a href="https://docs.google.com/document/d/1i395On2ZByesCyRaIDocu1aIguhVxuHBQ1l_nPfVReQ/edit?usp=sharing" target="_blank" rel="noopener">Terms &amp; Conditions</a> &middot; &copy; 2026
    </div>
  </div>`;
}

/* ---------- YOUR PATTERN ---------- */

function patternHtml() {
  return `
    <div class="topbar-left"><div class="topbar-icon">\u{1F981}</div><div class="topbar-title">Welcome, Amy</div></div>
    <h2 class="center">${PATTERN_TITLE}</h2>
    <div class="card ritual">
      <p style="margin-bottom:0; color:var(--text);">${PATTERN_INTRO[0]}</p>
    </div>
    <div class="card">
      <p style="margin-bottom:0;">${PATTERN_INTRO[1]}</p>
    </div>
    <div class="tagline">${PATTERN_TAGLINE}</div>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn gold" onclick="go({activeTab:'interrupt'})">Open The Interrupt Tool &rarr;</button>
    </div>
  `;
}

/* ---------- INTERRUPT TOOL ---------- */

function interruptHtml() {
  const step = INTERRUPT_STEPS[state.interruptStep];
  const isLast = state.interruptStep === INTERRUPT_STEPS.length - 1;
  const dots = INTERRUPT_STEPS.map((s, i) => `<div class="step-dot ${i === state.interruptStep ? "active" : ""}"></div>`).join("");
  return `
    <h2>\u{1F338} When The Hurt Resurfaces</h2>
    <p>Walk through this instead of getting swept into it. Give yourself the self-love first, before trying to understand him or fix anything.</p>
    <div class="step-progress">STEP ${state.interruptStep + 1} OF ${INTERRUPT_STEPS.length}</div>
    <div class="step-dots">${dots}</div>
    <div class="card">
      <h3>${step.title}</h3>
      <div class="journal-q">${step.prompt}</div>
      <textarea id="interruptField">${state.interruptAnswers[state.interruptStep] || ""}</textarea>
    </div>
    <div class="btn-row">
      ${state.interruptStep > 0 ? `<button class="btn ghost" onclick="interruptNav(-1)">&larr; Back</button>` : ""}
      ${isLast ? `<button class="btn gold" onclick="saveInterrupt()">Save This Practice</button>` : `<button class="btn gold" onclick="interruptNav(1)">Continue &rarr;</button>`}
    </div>
  `;
}

function interruptNav(dir) {
  state.interruptAnswers[state.interruptStep] = document.getElementById("interruptField").value;
  go({ interruptStep: state.interruptStep + dir });
}

function saveInterrupt() {
  state.interruptAnswers[state.interruptStep] = document.getElementById("interruptField").value;
  state.savedInterrupts.push({ date: new Date().toLocaleString(), answers: { ...state.interruptAnswers } });
  go({ interruptStep: 0, interruptAnswers: {}, activeTab: "journal" });
}

/* ---------- QUOTE CARDS ---------- */

function quotesHtml() {
  const cards = QUOTE_CARDS.map(c => `
    <div class="quote-card">
      <div class="label">${c.label.toUpperCase()}</div>
      <div class="quote">"${c.quote}"</div>
      ${c.meta ? `<div class="meta">${c.meta}</div>` : ""}
    </div>
  `).join("");
  return `
    <h2>\u2728 Your Messages</h2>
    <p>Direct lines channeled during your Lion's Gate reading. Come back to these anytime you need to hear it again.</p>
    ${cards}
  `;
}

/* ---------- DAILY PRACTICE + CARD PULL ---------- */

let breathTimer = null;
const BOX_PHASES = ["Breathe in...", "Hold...", "Breathe out...", "Hold..."];

const CARD_DECK = [
  ["The Sun", "A day for warmth, clarity, and letting yourself be seen exactly as you are."],
  ["The Empress", "Your divine feminine energy is asking to be honored today, not earned."],
  ["Queen of Cups", "Lean back into your feelings today. You don't have to hold everything together."],
  ["The World", "Something is completing or integrating today. Notice what feels finished."],
  ["Ace of Cups", "A fresh wave of feeling or connection may be opening today. Let it in."],
  ["The Hermit", "A day for turning inward. You don't owe anyone your energy today."],
  ["Queen of Wands", "Your confidence and magnetism are available today, if you claim them."],
  ["The Chariot", "Forward motion today. Trust the direction you're already moving in."],
  ["Six of Cups", "A gentle day, maybe touched by nostalgia. Let old memories visit without staying too long."],
  ["The High Priestess", "Trust your intuition today over any outside voice, including your own overthinking."],
  ["Justice", "A day to notice where balance is or isn't present in your relationships."],
  ["Knight of Wands", "Bold, forward energy today. A good day to say the brave thing."],
  ["Four of Cups", "You might feel a little emotionally flat today. That's okay, it usually passes."],
  ["Death", "Something is ready to be released today, to make room for what's next."],
  ["The Star", "A hopeful, healing day. Let yourself feel a little lighter than usual."],
  ["Nine of Pentacles", "You've built something real. Let yourself enjoy it today, no guilt required."],
  ["Two of Swords", "A choice may be sitting in front of you today. It's okay not to force clarity yet."],
  ["Queen of Pentacles", "Nurture yourself the way you'd nurture someone you love today."],
  ["The Moon", "Feelings may run a little foggy today. Be gentle rather than trying to figure it out."],
  ["Ten of Cups", "A day for noticing the good that's already present in your life."],
  ["King of Wands", "A day for leading with passion. Say yes to the thing that lights you up."],
  ["Wheel of Fortune", "Something is shifting today, in your favor, even if it's not obvious yet."],
  ["The Magician", "You have exactly what you need today. Trust your own resourcefulness."],
  ["Strength", "Gentleness is your real power today, not force."],
  ["Three of Cups", "A good day to reach out to a friend, celebration energy is around you."],
  ["Temperance", "Balance and patience are the theme today. No need to rush anything."],
  ["Ace of Pentacles", "A small new beginning may show up today. Notice it."],
  ["Judgement", "A day for self-reflection without harsh self-judgment."],
  ["Two of Cups", "Connection is highlighted today, notice who feels mutual."],
  ["King of Cups", "Emotional steadiness is available to you today, even amid a lot going on."]
];

function todayKey() {
  return new Date().toISOString().slice(0, 10);
}

function practiceHtml() {
  const key = todayKey();
  const pulled = state.cardPullLog[key];
  const cardResultHtml = pulled ? `
    <div class="quote-card" style="margin-top:14px;">
      <div class="label">TODAY'S CARD</div>
      <div class="quote">${pulled.name}</div>
      <div class="meta" style="margin-top:6px; color:var(--muted);">${pulled.meaning}</div>
    </div>
  ` : "";
  return `
    <h2>\u{1F56F} ${PRACTICE_TITLE}</h2>
    <div class="practice-box">
      <div class="lbl">The Ritual</div>
      <p style="margin-bottom:0; color:var(--text);">${PRACTICE_BODY}</p>
    </div>
    <p>Ground first with a short breath, then begin.</p>
    <div class="breathe-wrap">
      <div class="breathe-ball" id="breatheBall"></div>
      <div class="breathe-label" id="breatheLabel">Press start when you're ready</div>
      <button class="btn ghost small" id="breatheBtn" onclick="toggleBreathing()">Start Breathing</button>
    </div>
    <div class="section-label">Daily Card Pull</div>
    <p>Pull one card each day as a small check-in with your own energy. Not a prediction, just a mirror.</p>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn gold" onclick="pullCard()">${pulled ? "Pull Again" : "Pull Today's Card"}</button>
    </div>
    ${cardResultHtml}
  `;
}

function pullCard() {
  const key = todayKey();
  const idx = Math.floor(Math.random() * CARD_DECK.length);
  const [name, meaning] = CARD_DECK[idx];
  state.cardPullLog[key] = { name, meaning };
  render();
}

function toggleBreathing() {
  const ball = document.getElementById("breatheBall");
  const label = document.getElementById("breatheLabel");
  const btn = document.getElementById("breatheBtn");
  if (state.breathing) {
    state.breathing = false; clearTimeout(breathTimer);
    ball.style.transform = "scale(1)"; label.textContent = "Press start when you're ready"; btn.textContent = "Start Breathing";
    return;
  }
  state.breathing = true; btn.textContent = "Stop";
  let phase = 0;
  const runPhase = () => {
    if (!state.breathing) return;
    label.textContent = BOX_PHASES[phase];
    ball.style.transition = "transform 4s ease-in-out";
    if (phase === 0) ball.style.transform = "scale(1.35)";
    else if (phase === 2) ball.style.transform = "scale(1)";
    phase = (phase + 1) % 4;
    breathTimer = setTimeout(runPhase, 4000);
  };
  runPhase();
}

/* ---------- JOURNAL ---------- */

function journalHtml() {
  const n = state.activeDay;
  const existing = state.dayJournal[n] || {};
  const pills = Array.from({ length: TOTAL_DAYS }, (_, i) => i + 1).map(num => {
    const hasEntry = state.dayJournal[num] && JOURNAL_PROMPTS.every((p, i) => state.dayJournal[num][i] && state.dayJournal[num][i].trim());
    return `<div class="day-pill ${n === num ? "active" : ""} ${hasEntry ? "done" : ""}" onclick="go({activeDay:${num}})">${num}</div>`;
  }).join("");

  const fields = JOURNAL_PROMPTS.map((p, i) => `
    <div class="journal-q">${p}</div>
    <textarea id="jday-${i}">${existing[i] || ""}</textarea>
  `).join("");

  const pastInterrupts = state.savedInterrupts.length ? `
    <div class="section-label">Saved Interrupt Practices</div>
    <div class="card">${[...state.savedInterrupts].reverse().map(p => `
      <div style="margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--line);">
        <div class="journal-q" style="color:var(--gold-soft);">${p.date}</div>
        ${INTERRUPT_STEPS.map((s, i) => p.answers[i] ? `<div class="journal-q">${s.title}</div><p style="margin-bottom:8px;">${p.answers[i]}</p>` : "").join("")}
      </div>
    `).join("")}</div>
  ` : "";

  return `
    <h2>\u{1F4D3} Your Journal</h2>
    <p>Your private space to check in as you move through these six months, day by day.</p>
    <div class="day-pills">${pills}</div>
    <div class="card">
      <div class="day-badge">DAY ${n} OF ${TOTAL_DAYS}</div>
      ${fields}
      <button class="btn gold small" onclick="saveDayJournal()">${state.dayJournal[n] ? "\u2726 Update" : "Save Today"}</button>
    </div>
    ${pastInterrupts}
    <div class="btn-row"><button class="btn gold" onclick="downloadJournal()">Download My Journal</button></div>
    <div class="card ritual" style="margin-top:24px;">
      <h3>\u{1F981} Ready for the Full Year?</h3>
      <p style="margin-bottom:0;">You can upgrade to the 12-Month Edition within one month of your original booking. Your third and fourth quarter would be delivered written, matching this exact reading.</p>
      <div class="btn-row"><a href="https://stan.store/LuanaSpirits/p/-complete-your-lions-gate-union-activation-upgrade" class="btn gold small" target="_blank" rel="noopener">Learn More</a></div>
    </div>
  `;
}

function saveDayJournal() {
  const answers = {};
  JOURNAL_PROMPTS.forEach((p, i) => { answers[i] = document.getElementById("jday-" + i).value; });
  state.dayJournal[state.activeDay] = answers;
  render();
}

function downloadJournal() {
  let text = "The Lion's Gate Union Activation\nAmy's Journal\n\n";
  const days = Object.keys(state.dayJournal).map(k => parseInt(k)).sort((a, b) => a - b);
  if (days.length) {
    text += "== JOURNAL ==\n";
    days.forEach(n => {
      const ans = state.dayJournal[n];
      text += "Day " + n + "\n";
      JOURNAL_PROMPTS.forEach((p, i) => { if (ans[i]) text += p + "\n" + ans[i] + "\n\n"; });
    });
  }
  if (state.savedInterrupts.length) {
    text += "== INTERRUPT PRACTICES ==\n";
    state.savedInterrupts.forEach(p => {
      text += p.date + "\n";
      INTERRUPT_STEPS.forEach((s, i) => { if (p.answers[i]) text += s.title + ": " + p.answers[i] + "\n"; });
      text += "\n";
    });
  }
  if (!days.length && !state.savedInterrupts.length) text += "No entries yet.\n";
  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "amy-lions-gate-journal.txt";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------- ROUTER ---------- */

function render() {
  saveState();
  let content = "";
  if (state.activeTab === "pattern") content = patternHtml();
  else if (state.activeTab === "interrupt") content = interruptHtml();
  else if (state.activeTab === "quotes") content = quotesHtml();
  else if (state.activeTab === "practice") content = practiceHtml();
  else if (state.activeTab === "journal") content = journalHtml();

  document.getElementById("app").innerHTML = `${topNav()}${content}${footer()}`;
}

loadState();
(function setInitialDay() {
  const START = new Date('2026-08-06T00:00:00');
  const dayIndex = Math.floor((new Date() - START) / 86400000) + 1;
  const clamped = Math.max(1, Math.min(dayIndex, TOTAL_DAYS));
  if (!state.hasVisited) {
    state.activeDay = clamped;
    state.hasVisited = true;
  }
})();
render();
</script>
